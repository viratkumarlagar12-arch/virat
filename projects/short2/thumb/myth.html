<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ghutan Villain Thumbnail</title>
<style>
@font-face{font-family:Anton;src:url("file:///home/user/virat/editor/assets/fonts/Anton-400.ttf");font-weight:400}
@font-face{font-family:Montserrat;src:url("file:///home/user/virat/editor/assets/fonts/Montserrat-900.ttf");font-weight:900}
@font-face{font-family:Montserrat;src:url("file:///home/user/virat/editor/assets/fonts/Montserrat-800.ttf");font-weight:800}
@font-face{font-family:Poppins;src:url("file:///home/user/virat/editor/assets/fonts/Poppins-900.ttf");font-weight:900}
@font-face{font-family:Poppins;src:url("file:///home/user/virat/editor/assets/fonts/Poppins-800.ttf");font-weight:800}

:root{
  --gold:#ffc53d;
  --gold2:#ff9d00;
  --blue:#3fb6ff;
  --red:#ff3b2f;
}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#02030a}
.abs{position:absolute;left:0;top:0}

/* split background: cool blue left, hot red right, diagonal seam */
#bgL{position:absolute;inset:0;
  background:radial-gradient(ellipse 620px 760px at 230px 980px,rgba(30,120,255,.55),rgba(10,40,120,.25) 55%,rgba(0,0,0,0) 80%);}
#bgR{position:absolute;inset:0;
  background:radial-gradient(ellipse 640px 780px at 850px 960px,rgba(255,60,20,.60),rgba(140,20,10,.28) 55%,rgba(0,0,0,0) 80%);
  clip-path:polygon(600px 0,1080px 0,1080px 1920px,480px 1920px);}
#bgL2{position:absolute;inset:0;clip-path:polygon(0 0,600px 0,480px 1920px,0 1920px);
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(10,50,140,.18) 45%,rgba(0,0,0,0) 85%);}

/* headline */
#head{position:absolute;left:0;top:190px;width:1080px;text-align:center;z-index:5}
.l1{font-family:Anton;font-size:150px;line-height:1;color:#fff;letter-spacing:2px;
  text-shadow:0 8px 0 #000,0 0 30px rgba(0,0,0,.9);}
.l2{font-family:Anton;font-size:186px;line-height:1.02;letter-spacing:1px;margin-top:4px;
  color:var(--gold);
  background:linear-gradient(180deg,#fff3b0 0%,#ffd23f 38%,#ff9d00 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 9px 0 #000) drop-shadow(0 0 22px rgba(255,140,0,.55));}

/* molecules */
#mol{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:3}

/* labels */
.lab{position:absolute;font-family:Montserrat;font-weight:900;text-align:center;line-height:1;z-index:6}
.lab sub{font-size:.55em;vertical-align:baseline;position:relative;top:.18em;margin-left:2px}
#labO{left:20px;width:470px;top:1196px;font-size:104px;color:#e9f6ff;
  text-shadow:0 7px 0 #000,0 0 26px rgba(63,182,255,.9);}
#labC{left:585px;width:470px;top:1172px;font-size:140px;color:#fff;
  text-shadow:0 8px 0 #000,0 0 30px rgba(255,59,47,1);}

#vs{position:absolute;left:540px;top:925px;width:176px;height:176px;margin:-88px 0 0 -88px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff7cc,#ffc53d 45%,#ff8a00 100%);
  box-shadow:0 0 0 10px #000,0 0 50px rgba(255,190,60,.9);
  display:flex;align-items:center;justify-content:center;z-index:7}
#vs span{font-family:Poppins;font-weight:900;font-size:84px;color:#111;letter-spacing:-4px;margin-top:9px}

.pill{position:absolute;font-family:Montserrat;font-weight:900;font-size:62px;line-height:1;padding:14px 30px 12px;border-radius:999px;
  border:5px solid #000;z-index:6;letter-spacing:1px;transform-origin:center}
#pillO{left:255px;top:1330px;translate:-50% 0;background:#bfe8ff;color:#05205a;box-shadow:0 6px 0 #000,0 0 24px rgba(63,182,255,.7)}
#pillC{left:820px;top:1330px;translate:-50% 0;background:#ffd23f;color:#3a0500;box-shadow:0 6px 0 #000,0 0 28px rgba(255,80,30,.9)}
#brand{position:absolute;left:0;width:1080px;top:1700px;text-align:center;z-index:3;line-height:1}
#brand .b1{font-family:Montserrat;font-weight:900;font-size:46px;letter-spacing:14px;
  background:linear-gradient(180deg,#ffffff,#b9c3cf);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#brand .b2{font-family:Montserrat;font-weight:800;font-size:30px;letter-spacing:10px;margin-top:8px;color:#ffc53d}
#earth{position:absolute;left:-300px;top:1560px;width:1680px;height:1680px;border-radius:50%;
  background:radial-gradient(circle at 50% 0%,#0b2b66 0%,#04122e 30%,#010510 60%);
  box-shadow:0 -6px 30px 6px rgba(80,170,255,.85),0 -30px 120px 30px rgba(40,110,255,.45);z-index:2}
#sun{position:absolute;left:540px;top:1556px;width:520px;height:90px;margin-left:-260px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,240,190,1) 0%,rgba(255,190,70,.8) 25%,rgba(255,140,0,.25) 55%,rgba(0,0,0,0) 72%);z-index:2}
</style>
</head>
<body>
<div id="stage">
  <canvas id="stars" class="abs" width="1080" height="1920"></canvas>
  <div id="bgL"></div><div id="bgL2"></div><div id="bgR"></div>

  <!-- seam lightning -->
  <svg class="abs" width="1080" height="1920" style="z-index:4">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="8" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <polyline filter="url(#glow)" fill="none" stroke="#ffe08a" stroke-width="7" stroke-linejoin="miter"
      points="586,560 566,660 600,700 556,800 585,840 540,930"/>
    <polyline filter="url(#glow)" fill="none" stroke="#ffe08a" stroke-width="7" stroke-linejoin="miter"
      points="540,930 515,1030 548,1070 505,1170 532,1210 512,1300 530,1330 506,1460"/>
  </svg>

  <svg id="mol" width="1080" height="1920" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="gBlue" cx="38%" cy="32%" r="70%">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".18" stop-color="#bfe8ff"/>
        <stop offset=".55" stop-color="#2f9bff"/>
        <stop offset="1" stop-color="#0a2f8a"/>
      </radialGradient>
      <radialGradient id="gRed" cx="38%" cy="32%" r="70%">
        <stop offset="0" stop-color="#fff2e8"/>
        <stop offset=".18" stop-color="#ffb199"/>
        <stop offset=".55" stop-color="#ff3b2f"/>
        <stop offset="1" stop-color="#7a0700"/>
      </radialGradient>
      <radialGradient id="gCarbon" cx="38%" cy="30%" r="72%">
        <stop offset="0" stop-color="#9a9aa6"/>
        <stop offset=".35" stop-color="#3a3a44"/>
        <stop offset="1" stop-color="#0b0b10"/>
      </radialGradient>
      <radialGradient id="haloBlue" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#3fb6ff" stop-opacity=".55"/>
        <stop offset="1" stop-color="#3fb6ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="haloRed" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ff4a1a" stop-opacity=".8"/>
        <stop offset=".5" stop-color="#ff2a00" stop-opacity=".35"/>
        <stop offset="1" stop-color="#ff2a00" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
      <radialGradient id="eyeGlowSoft" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ffb000" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff6a0"/>
        <stop offset=".5" stop-color="#ffd000"/>
        <stop offset="1" stop-color="#ff7a00"/>
      </radialGradient>
    </defs>

    <!-- O2 (left) -->
    <!-- background particles -->
    <g opacity=".35" filter="url(#soft)">
      <g transform="translate(110 640) rotate(20)"><circle cx="-16" r="18" fill="#3fb6ff"/><circle cx="16" r="18" fill="#3fb6ff"/></g>
      <g transform="translate(440 1160) rotate(-35)"><circle cx="-13" r="14" fill="#3fb6ff"/><circle cx="13" r="14" fill="#3fb6ff"/></g>
      <g transform="translate(70 1180) rotate(60)"><circle cx="-11" r="12" fill="#3fb6ff"/><circle cx="11" r="12" fill="#3fb6ff"/></g>
      <g transform="translate(980 640) rotate(-15)"><circle cx="-24" r="12" fill="#ff4a2a"/><circle r="15" fill="#555"/><circle cx="24" r="12" fill="#ff4a2a"/></g>
      <g transform="translate(1000 1180) rotate(40)"><circle cx="-20" r="10" fill="#ff4a2a"/><circle r="12" fill="#555"/><circle cx="20" r="10" fill="#ff4a2a"/></g>
      <g transform="translate(640 1180) rotate(-30)"><circle cx="-18" r="9" fill="#ff4a2a"/><circle r="11" fill="#555"/><circle cx="18" r="9" fill="#ff4a2a"/></g>
    </g>
    <g transform="translate(248 905) rotate(-28)">
      <ellipse cx="0" cy="0" rx="320" ry="250" fill="url(#haloBlue)"/>
      <rect x="-100" y="-24" width="200" height="15" rx="7" fill="#cfefff" opacity=".9"/>
      <rect x="-100" y="9" width="200" height="15" rx="7" fill="#cfefff" opacity=".9"/>
      <circle cx="108" cy="0" r="116" fill="url(#gBlue)" stroke="#000" stroke-width="8"/>
      <circle cx="-100" cy="0" r="122" fill="url(#gBlue)" stroke="#000" stroke-width="8"/>
      <!-- worried face, level -->
      <g transform="translate(-100 0) rotate(28)">
        <ellipse cx="-34" cy="-6" rx="24" ry="32" fill="#fff" stroke="#06205a" stroke-width="5"/>
        <ellipse cx="34" cy="-6" rx="24" ry="32" fill="#fff" stroke="#06205a" stroke-width="5"/>
        <circle cx="-24" cy="-2" r="12" fill="#04102e"/>
        <circle cx="44" cy="-2" r="12" fill="#04102e"/>
        <path d="M-64 -46 Q-42 -50 -16 -66" fill="none" stroke="#04102e" stroke-width="9" stroke-linecap="round"/>
        <path d="M64 -46 Q42 -50 16 -66" fill="none" stroke="#04102e" stroke-width="9" stroke-linecap="round"/>
        <ellipse cx="4" cy="52" rx="13" ry="16" fill="#04102e"/>
        <path d="M84 -34 q13 24 0 37 q-13 -13 0 -37z" fill="#bfe8ff" stroke="#06205a" stroke-width="3"/>
      </g>
    </g>

    <!-- CO2 (right) -->
    <g transform="translate(818 915) rotate(24)">
      <ellipse cx="0" cy="0" rx="380" ry="280" fill="url(#haloRed)"/>
      <circle cx="-162" cy="0" r="86" fill="url(#gRed)" stroke="#000" stroke-width="8"/>
      <circle cx="162" cy="0" r="86" fill="url(#gRed)" stroke="#000" stroke-width="8"/>
      <circle cx="0" cy="0" r="122" fill="url(#gCarbon)" stroke="#000" stroke-width="8"/>
      <circle cx="0" cy="0" r="128" fill="none" stroke="#ff5a2a" stroke-width="10" opacity=".75" filter="url(#soft)"/>
      <!-- villain face, level -->
      <g transform="rotate(-24)">
        <ellipse cx="0" cy="-8" rx="92" ry="40" fill="url(#eyeGlowSoft)"/>
        <path d="M-84 -20 L-14 6 L-22 30 Q-62 34 -86 6 Z" fill="url(#eyeGlow)"/>
        <path d="M84 -20 L14 6 L22 30 Q62 34 86 6 Z" fill="url(#eyeGlow)"/>
        <path d="M-98 -46 L-6 -4" stroke="#000" stroke-width="20" stroke-linecap="round"/>
        <path d="M98 -46 L6 -4" stroke="#000" stroke-width="20" stroke-linecap="round"/>
        <path d="M-58 52 Q0 100 58 52 Q0 74 -58 52 Z" fill="#ffd000" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
      </g>
    </g>
  </svg>

  <div id="vs"><span>VS</span></div>

  <div id="head">
    <div class="l1">GHUTAN KA</div>
    <div class="l2">ASLI VILLAIN?</div>
  </div>

  <div id="labO" class="lab">OXYGEN</div>
  <div id="labC" class="lab">CO<sub>2</sub></div>
  <div id="pillO" class="pill">KAM?</div>
  <div id="pillC" class="pill">ZYADA?</div>

  <div id="earth"></div>
  <div id="sun"></div>
  <div id="brand"><div class="b1">SCIENCE</div><div class="b2">UNSEEN HINDI</div></div>
</div>
<script>
(function(){
  var c=document.getElementById('stars'),x=c.getContext('2d');
  var s=1234567;function r(){s=(s*16807)%2147483647;return s/2147483647;}
  x.fillStyle='#02030a';x.fillRect(0,0,1080,1920);
  for(var i=0;i<520;i++){
    var px=r()*1080,py=r()*1920,rad=r()<.92?r()*1.4+.3:r()*2.4+1.2,a=.25+r()*.75;
    x.beginPath();x.arc(px,py,rad,0,6.283);x.fillStyle='rgba(255,255,255,'+a.toFixed(2)+')';x.fill();
  }
})();
</script>
</body>
</html>
