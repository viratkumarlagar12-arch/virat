<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Villain Kaun Thumbnail</title>
<style>
@font-face{font-family:Anton;src:url("file:///home/user/virat/editor/assets/fonts/Anton-400.ttf");font-weight:400}
@font-face{font-family:Montserrat;src:url("file:///home/user/virat/editor/assets/fonts/Montserrat-900.ttf");font-weight:900}
@font-face{font-family:Montserrat;src:url("file:///home/user/virat/editor/assets/fonts/Montserrat-800.ttf");font-weight:800}
@font-face{font-family:Poppins;src:url("file:///home/user/virat/editor/assets/fonts/Poppins-900.ttf");font-weight:900}

:root{
  --gold:#ffc53d;
  --blue:#3fb6ff;
  --red:#ff3b2f;
}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#02030a}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#02030a}
.abs{position:absolute;left:0;top:0}

/* split background: cool blue left (oxygen side), hot red right (CO2 side); seam passes through the VS badge */
#bgL{position:absolute;inset:0;
  background:radial-gradient(ellipse 640px 780px at 240px 830px,rgba(30,120,255,.60),rgba(10,40,120,.28) 55%,rgba(0,0,0,0) 82%);}
#bgL2{position:absolute;inset:0;clip-path:polygon(0 0,592px 0,472px 1920px,0 1920px);
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(10,50,150,.22) 40%,rgba(0,0,0,0) 80%);}
#bgR{position:absolute;inset:0;
  background:radial-gradient(ellipse 660px 800px at 850px 820px,rgba(255,70,20,.62),rgba(140,20,10,.30) 55%,rgba(0,0,0,0) 82%);
  clip-path:polygon(592px 0,1080px 0,1080px 1920px,472px 1920px);}

/* headline */
#head{position:absolute;left:0;top:196px;width:1080px;text-align:center;z-index:8;white-space:nowrap;line-height:1}
#head span{display:inline-block;font-family:Anton;font-size:174px;line-height:1.04;vertical-align:top}
#head .w{color:#fff;letter-spacing:2px;
  text-shadow:0 10px 0 #000,0 0 34px rgba(0,0,0,.95);}
#head .g{margin-left:30px;letter-spacing:1px;
  background:linear-gradient(180deg,#fff3b0 0%,#ffd23f 38%,#ff9d00 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 10px 0 #000) drop-shadow(0 0 26px rgba(255,140,0,.6));}

/* labels */
.lab{position:absolute;font-family:Montserrat;font-weight:900;text-align:center;line-height:1;z-index:7;white-space:nowrap}
.lab sub{font-size:.55em;vertical-align:baseline;position:relative;top:.16em;margin-left:3px}
#labO{left:60px;width:440px;top:462px;font-size:100px;color:#eef8ff;letter-spacing:1px;
  text-shadow:0 8px 0 #000,0 0 28px rgba(63,182,255,1),0 0 60px rgba(63,182,255,.6);}
#labC{left:600px;width:420px;top:438px;font-size:138px;color:#fff;
  text-shadow:0 9px 0 #000,0 0 30px rgba(255,59,47,1),0 0 64px rgba(255,80,30,.6);}

#earth{position:absolute;left:-300px;top:1452px;width:1680px;height:1680px;border-radius:50%;
  background:radial-gradient(circle at 50% 0%,#0b2b66 0%,#04122e 30%,#010510 60%);
  box-shadow:0 -6px 30px 6px rgba(80,170,255,.9),0 -30px 120px 30px rgba(40,110,255,.45);z-index:2}
#sun{position:absolute;left:540px;top:1404px;width:620px;height:100px;margin-left:-310px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,244,200,1) 0%,rgba(255,196,80,.85) 22%,rgba(255,140,0,.28) 52%,rgba(0,0,0,0) 72%);z-index:3}
#brand{position:absolute;left:0;width:1080px;top:1640px;text-align:center;z-index:3;line-height:1}
#brand .b1{font-family:Montserrat;font-weight:900;font-size:46px;letter-spacing:14px;
  background:linear-gradient(180deg,#ffffff,#b9c3cf);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#brand .b2{font-family:Montserrat;font-weight:800;font-size:30px;letter-spacing:10px;margin-top:8px;color:#ffc53d}
</style>
</head>
<body>
<div id="stage">
  <canvas id="stars" class="abs" width="1080" height="1920"></canvas>
  <div id="bgL"></div><div id="bgL2"></div><div id="bgR"></div>

  <!-- seam: thick glowing bolt, behind the molecules, ends at y 1420 -->
  <svg class="abs" width="1080" height="1920" style="z-index:3">
    <defs>
      <filter id="seamGlow" x="-200%" y="-20%" width="500%" height="140%">
        <feGaussianBlur stdDeviation="14" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="seamFade" x1="0" y1="430" x2="0" y2="1420" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#fff2b8" stop-opacity="0"/>
        <stop offset=".12" stop-color="#fff2b8" stop-opacity="1"/>
        <stop offset=".85" stop-color="#ffe08a" stop-opacity="1"/>
        <stop offset="1" stop-color="#ffe08a" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <polyline id="seam" filter="url(#seamGlow)" fill="none" stroke="url(#seamFade)" stroke-width="14" stroke-linejoin="miter" stroke-linecap="round"
      points="583,430 562,540 596,590 550,700 578,740 540,790 516,900 548,950 506,1060 536,1110 512,1220 530,1260 508,1420"/>
  </svg>

  <svg id="mol" class="abs" width="1080" height="1920" viewBox="0 0 1080 1920" style="z-index:5">
    <defs>
      <!-- oxygen atoms: standard red (CPK) in BOTH molecules -->
      <radialGradient id="gOx" cx="38%" cy="32%" r="70%">
        <stop offset="0" stop-color="#fff0f2"/>
        <stop offset=".16" stop-color="#ffb3c0"/>
        <stop offset=".52" stop-color="#f5384f"/>
        <stop offset="1" stop-color="#6e0618"/>
      </radialGradient>
      <!-- blue rim light for the O2 molecule (from the blue side) -->
      <radialGradient id="rimBlue" cx="62%" cy="62%" r="62%">
        <stop offset=".72" stop-color="#5cc8ff" stop-opacity="0"/>
        <stop offset=".93" stop-color="#5cc8ff" stop-opacity=".75"/>
        <stop offset="1" stop-color="#bff0ff" stop-opacity=".95"/>
      </radialGradient>
      <!-- warm rim for CO2 -->
      <radialGradient id="rimWarm" cx="40%" cy="40%" r="62%">
        <stop offset=".74" stop-color="#ff8a3a" stop-opacity="0"/>
        <stop offset="1" stop-color="#ffb070" stop-opacity=".8"/>
      </radialGradient>
      <radialGradient id="gCarbon" cx="38%" cy="30%" r="72%">
        <stop offset="0" stop-color="#d2d6de"/>
        <stop offset=".22" stop-color="#8d929e"/>
        <stop offset=".6" stop-color="#4b4f5a"/>
        <stop offset="1" stop-color="#22242b"/>
      </radialGradient>
      <radialGradient id="haloBlue" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#3fb6ff" stop-opacity=".55"/>
        <stop offset="1" stop-color="#3fb6ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="haloRed" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#ff4a1a" stop-opacity=".7"/>
        <stop offset=".5" stop-color="#ff2a00" stop-opacity=".3"/>
        <stop offset="1" stop-color="#ff2a00" stop-opacity="0"/>
      </radialGradient>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
      <filter id="qglow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="9" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="vsGold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff7cc"/>
        <stop offset=".45" stop-color="#ffc53d"/>
        <stop offset="1" stop-color="#ff8a00"/>
      </linearGradient>
    </defs>

    <!-- faint background molecules (same colour code: O red, C grey) -->
    <g opacity=".32" filter="url(#soft)">
      <g transform="translate(112 650) rotate(20)"><circle cx="-15" r="16" fill="#f5384f"/><circle cx="15" r="16" fill="#f5384f"/></g>
      <g transform="translate(96 1370) rotate(60)"><circle cx="-11" r="12" fill="#f5384f"/><circle cx="11" r="12" fill="#f5384f"/></g>
      <g transform="translate(300 1395) rotate(-35)"><circle cx="-12" r="13" fill="#f5384f"/><circle cx="12" r="13" fill="#f5384f"/></g>
      <g transform="translate(988 650) rotate(-15)"><circle cx="-24" r="12" fill="#f5384f"/><circle r="15" fill="#777"/><circle cx="24" r="12" fill="#f5384f"/></g>
      <g transform="translate(985 1395) rotate(40)"><circle cx="-20" r="10" fill="#f5384f"/><circle r="12" fill="#777"/><circle cx="20" r="10" fill="#f5384f"/></g>
      <g transform="translate(720 1390) rotate(-30)"><circle cx="-18" r="9" fill="#f5384f"/><circle r="11" fill="#777"/><circle cx="18" r="9" fill="#f5384f"/></g>
    </g>

    <!-- ===== O2 (left), red oxygen atoms with blue rim light ===== -->
    <g id="shift" transform="translate(0 40)">
    <g id="o2" transform="translate(336 900) rotate(-64)">
      <ellipse cx="0" cy="0" rx="430" ry="320" fill="url(#haloBlue)"/>
      <!-- back atom (toward the centre, up) -->
      <g transform="translate(150 0)">
        <circle r="185" fill="url(#gOx)" stroke="#000" stroke-width="10"/>
        <circle r="180" fill="url(#rimBlue)"/>
      </g>
      <!-- front atom with face -->
      <g transform="translate(-150 0)">
        <circle r="200" fill="url(#gOx)" stroke="#000" stroke-width="10"/>
        <circle r="195" fill="url(#rimBlue)"/>
        <!-- worried "not me!" face, glancing at CO2 -->
        <g transform="rotate(64) scale(1.28)">
          <ellipse cx="-44" cy="-8" rx="31" ry="41" fill="#fff" stroke="#3a0410" stroke-width="6"/>
          <ellipse cx="44" cy="-8" rx="31" ry="41" fill="#fff" stroke="#3a0410" stroke-width="6"/>
          <circle cx="-30" cy="-4" r="15" fill="#1a0207"/>
          <circle cx="58" cy="-4" r="15" fill="#1a0207"/>
          <circle cx="-26" cy="-9" r="4.5" fill="#fff"/>
          <circle cx="62" cy="-9" r="4.5" fill="#fff"/>
          <path d="M-84 -60 Q-56 -64 -22 -86" fill="none" stroke="#1a0207" stroke-width="11" stroke-linecap="round"/>
          <path d="M84 -60 Q56 -64 22 -86" fill="none" stroke="#1a0207" stroke-width="11" stroke-linecap="round"/>
          <path d="M-34 70 q8.5 -12 17 0 t17 0 t17 0 t17 0" fill="none" stroke="#1a0207" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M112 -52 q17 31 0 48 q-17 -17 0 -48z" fill="#d6f3ff" stroke="#06205a" stroke-width="4"/>
        </g>
      </g>
    </g>

    <!-- ===== CO2 (right): O = C = O, dark-grey carbon with a mischievous smirk ===== -->
    <g id="co2" transform="translate(746 940) rotate(58)">
      <ellipse cx="0" cy="0" rx="460" ry="320" fill="url(#haloRed)"/>
      <circle cx="-235" cy="0" r="140" fill="url(#gOx)" stroke="#000" stroke-width="10"/>
      <circle cx="235" cy="0" r="140" fill="url(#gOx)" stroke="#000" stroke-width="10"/>
      <circle cx="0" cy="0" r="200" fill="url(#gCarbon)" stroke="#000" stroke-width="10"/>
      <circle cx="0" cy="0" r="195" fill="url(#rimWarm)"/>
      <!-- smirk face, glancing at O2 -->
      <g transform="rotate(-58) scale(1.27)">
        <!-- eyes, half-lidded -->
        <ellipse cx="-46" cy="-6" rx="32" ry="38" fill="#fff" stroke="#111" stroke-width="6"/>
        <ellipse cx="46" cy="-6" rx="32" ry="38" fill="#fff" stroke="#111" stroke-width="6"/>
        <circle cx="-62" cy="2" r="15" fill="#111"/>
        <circle cx="30" cy="2" r="15" fill="#111"/>
        <circle cx="-66" cy="-3" r="4.5" fill="#fff"/>
        <circle cx="26" cy="-3" r="4.5" fill="#fff"/>
        <!-- upper lids (sly) -->
        <path d="M-81 -10 Q-46 -54 -11 -14 Z" fill="#555a66" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
        <path d="M11 -14 Q46 -54 81 -10 Z" fill="#555a66" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
        <!-- brows: left raised, right flat -->
        <path d="M-90 -66 Q-54 -102 -14 -74" fill="none" stroke="#111" stroke-width="11" stroke-linecap="round"/>
        <path d="M16 -60 L88 -66" fill="none" stroke="#111" stroke-width="11" stroke-linecap="round"/>
        <!-- lopsided half grin -->
        <path d="M-40 66 Q14 96 70 48 Q30 72 -40 66 Z" fill="#fff" stroke="#111" stroke-width="7" stroke-linejoin="round"/>
        <path d="M70 48 q10 -4 14 -14" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
      </g>
    </g>

    <!-- VS badge -->
    <g id="vs" transform="translate(536 758)">
      <g id="ring">
        <circle r="150" fill="#000" opacity=".85"/>
        <rect x="-26" y="-186" width="52" height="34" rx="8" fill="#c9ced8" stroke="#000" stroke-width="7"/>
        <rect x="-12" y="-158" width="24" height="16" fill="#8d929e" stroke="#000" stroke-width="5"/>
        <g id="segs" fill="none" stroke-width="24" stroke-linecap="butt"></g>
      </g>
      <circle r="104" fill="#000"/>
      <circle r="92" fill="url(#vsGold)"/>
      <circle r="92" fill="none" stroke="#fff6c8" stroke-width="3" opacity=".7"/>
    </g>
    </g>
  </svg>

  <div id="vsText" style="position:absolute;left:436px;top:698px;width:200px;height:200px;display:flex;align-items:center;justify-content:center;z-index:6">
    <span style="font-family:Poppins;font-weight:900;font-size:86px;color:#140800;letter-spacing:-4px;margin-top:10px">VS</span>
  </div>

  <!-- '?' spark between the two suspects -->
  <svg id="spark" class="abs" width="1080" height="1920" style="z-index:5">
    <defs>
      <radialGradient id="sparkG" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff3c0" stop-opacity=".95"/>
        <stop offset=".25" stop-color="#ffb52e" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="546" cy="1318" r="120" fill="url(#sparkG)"/>
    <g stroke="#ffe7a0" stroke-linecap="round" opacity=".9">
      <path d="M546 1196 L546 1222" stroke-width="7"/><path d="M546 1414 L546 1440" stroke-width="7"/>
      <path d="M432 1318 L456 1318" stroke-width="7"/><path d="M636 1318 L660 1318" stroke-width="7"/>
      <path d="M466 1238 L482 1254" stroke-width="6"/><path d="M626 1238 L610 1254" stroke-width="6"/>
      <path d="M466 1398 L482 1382" stroke-width="6"/><path d="M626 1398 L610 1382" stroke-width="6"/>
    </g>
  </svg>
  <div id="qmark" style="position:absolute;left:466px;top:1226px;width:160px;text-align:center;z-index:6;font-family:Anton;font-size:176px;line-height:1;color:#fffbe8;
    text-shadow:0 0 10px #ffd04a,0 0 30px #ff9a00,0 7px 0 #000;transform:rotate(8deg)">?</div>

  <div id="head"><span class="w">VILLAIN</span><span class="g">KAUN?</span></div>

  <div id="labO" class="lab">OXYGEN</div>
  <div id="labC" class="lab">CO<sub>2</sub></div>

  <div id="earth"></div>
  <div id="sun"></div>
  <div id="brand"><div class="b1">SCIENCE</div><div class="b2">UNSEEN HINDI</div></div>
</div>
<script>
(function(){
  var g=document.getElementById('segs'), R=128, n=10, gap=7;
  var cols=['#ffe27a','#ffd23f','#ffc53d','#ffb020','#ff9a1a','#ff7d1a','#ff5a1a','#ff3b2f','#3a1212','#3a1212'];
  for(var i=0;i<n;i++){
    var a0=(-90+i*36+gap/2)*Math.PI/180, a1=(-90+(i+1)*36-gap/2)*Math.PI/180;
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M'+(R*Math.cos(a0)).toFixed(1)+' '+(R*Math.sin(a0)).toFixed(1)+' A'+R+' '+R+' 0 0 1 '+(R*Math.cos(a1)).toFixed(1)+' '+(R*Math.sin(a1)).toFixed(1));
    p.setAttribute('stroke',cols[i]);g.appendChild(p);
  }
  var h=location.hash;
  if(h.indexOf('noring')>=0){document.getElementById('ring').style.display='none';}
  if(h.indexOf('noq')>=0){document.getElementById('qmark').style.display='none';document.getElementById('spark').style.display='none';}
})();
(function(){
  var c=document.getElementById('stars'),x=c.getContext('2d');
  var s=1234567;function r(){s=(s*16807)%2147483647;return s/2147483647;}
  x.fillStyle='#02030a';x.fillRect(0,0,1080,1920);
  for(var i=0;i<520;i++){
    var px=r()*1080,py=r()*1920,rad=r()<.92?r()*1.4+.3:r()*2.4+1.2,a=.25+r()*.75;
    x.beginPath();x.arc(px,py,rad,0,6.283);x.fillStyle='rgba(255,255,255,'+a.toFixed(2)+')';x.fill();
  }
})();
</script>
</body>
</html>
