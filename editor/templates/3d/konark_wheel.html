<title>Konark wheel sundial 3D</title>
<!-- Konark Sun Temple chariot wheel as a sundial (Three.js inside HyperFrames, CPU-renderable, deterministic).
     Weathered sandstone wheel (8 thick + 8 thin spokes, lotus-rosette rim with a rope moulding, medallions, projecting
     axle) set into a carved plinth wall that ends in a cornice + parapet against a golden-hour sky. A sun with real
     shadow mapping moves along an arc in that sky; the axle's shadow falls on the spokes like a clock hand.
     Settings live in the one-line window.CFG below; render3d.py --config '{"mode":"spokes"}' merges JSON over it.
       mode "sweep"  : off-axis slow orbit; sun travels sunFrom -> sunTo (deg, 0 = straight up, - = left) between
                       sweepStart and sweepEnd; the hub shadow turns across the spokes like a clock hand
                       (default -90 -> 90: shadow 3 o'clock -> 6 -> 9 o'clock, so both holds land on thick spokes).
       mode "spokes" : front-on; sun fixed at sunFixed (default -45: upper left, shadow on the 4:30 thick spoke); the
                       8 thick spokes light up one by one (spokeStart, spokeStagger), "8 PRAHAR" pops at praharAt (the
                       sun fades out of the title band just before), the 12-to-1:30 wedge fills gold at wedgeAt with
                       a "3 GHANTE" callout.
     Times are absolute seconds: if you raise duration, pass matching times too.
     Keep-out: nothing important in the top 150 px or bottom 420 px (captions / Shorts UI). -->
<script>
window.CFG = { duration: 4.5, mode: "sweep", sunFrom: -90, sunTo: 90, sweepStart: 0.2, sweepEnd: 4.2, spokeStart: 0.4, spokeStagger: 0.22, praharAt: 2.4, wedgeAt: 3.0, sunFixed: -45 };
</script>

<style>

#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1a120b; }
/* golden-hour sky behind the (transparent) WebGL canvas: only visible above the parapet */
#sky { position: absolute; inset: 0; pointer-events: none;

    radial-gradient(ellipse 78% 52% at 50% 45%, rgba(0,0,0,0) 58%, rgba(12,6,2,0.5) 100%),

/* soft bloom in front of the wall: spills over the parapet when the sun is low */
#sunF .glow { left: -230px; top: -230px; width: 460px; height: 460px; mix-blend-mode: screen;
  background: radial-gradient(circle, rgba(255,222,150,0.5) 0%, rgba(255,186,96,0.2) 30%, rgba(255,160,80,0.06) 55%, rgba(255,150,70,0) 72%); }

#ghante .tick { position: absolute; left: 60px; top: 100%; margin: 4px 0 0 -3px; width: 6px; height: 30px;
  background: #FFC233; border-radius: 3px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }

<script>
  (function () {
    const C = window.CFG, root = document.getElementById("root");
    root.setAttribute("data-duration", String(C.duration));
    const tl = gsap.timeline({ paused: true });
    if (C.mode === "spokes") {
      tl.fromTo("#prahar", { opacity: 0, scale: 0.35 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.4)" }, C.praharAt);
      tl.fromTo("#ghante", { opacity: 0, scale: 0.5, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(2.2)" }, C.wedgeAt + 0.18);
    }
    tl.set({}, {}, C.duration); // timeline length == composition length
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  })();

<script type="module">
import * as THREE from "three";

const CFG = window.CFG;
const W = 1080, H = 1920, D2R = Math.PI / 180;
const MODE = CFG.mode === "spokes" ? "spokes" : "sweep";
const SUN_FIXED = CFG.sunFixed ?? -45;
const ALT = 27 * D2R;          // sun height above the wheel plane: sets the shadow length
const FOV = 28;
const WALL_TOP = 1.22;         // top of the cornice (wheel radius = 1); sky above
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------------------------------------------------------------- seeded, tileable value noise
let seed = 20240917;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const P = new Uint8Array(512);
for (let i = 0; i < 256; i++) P[i] = i;
for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [P[i], P[j]] = [P[j], P[i]]; }
for (let i = 0; i < 256; i++) P[i + 256] = P[i];
const wrap = (i, p) => ((i % p) + p) % p & 255;
const GX = new Float32Array(256), GY = new Float32Array(256);
for (let i = 0; i < 256; i++) { const a = rnd() * Math.PI * 2; GX[i] = Math.cos(a); GY[i] = Math.sin(a); }
function tnoise(x, y, px, py) { // gradient noise, periodic in x with px and in y with py (integers); ~[0,1]
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const x0 = wrap(xi, px), x1 = wrap(xi + 1, px), y0 = wrap(yi, py), y1 = wrap(yi + 1, py);
  const g = (ix, iy, dx, dy) => { const h = P[P[ix] + iy]; return GX[h] * dx + GY[h] * dy; };
  const a = g(x0, y0, fx, fy), b = g(x1, y0, fx - 1, fy), c = g(x0, y1, fx, fy - 1), d = g(x1, y1, fx - 1, fy - 1);
  return 0.5 + 0.75 * (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v);
}
function tfbm(x, y, f, oct) { // x, y in [0,1): tileable fbm starting at integer frequency f
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { s += a * tnoise(x * f, y * f, f, f); n += a; f *= 2; a *= 0.5; }
  return s / n;
}

// ---------------------------------------------------------------- sandstone textures (colour + bump)
function makeCanvas(n) { const c = document.createElement("canvas"); c.width = c.height = n; return c; }
const TS = 1024;
const stoneC = makeCanvas(TS), bumpC = makeCanvas(TS);
{
  const ci = stoneC.getContext("2d").createImageData(TS, TS), bi = bumpC.getContext("2d").createImageData(TS, TS);
  for (let j = 0; j < TS; j++) {
    const v = j / TS;
    for (let i = 0; i < TS; i++) {
      const u = i / TS;
      const n = tfbm(u, v, 4, 6);                                   // broad mottling
      const st = tnoise(u * 2 + n * 1.2, v * 40, 2, 40);            // faint bedding strata
      const w = tfbm(u + 0.37, v + 0.71, 4, 4);                     // weathered (deeper ochre) patches
      const sp = tnoise(u * 160 + 0.5, v * 160 + 0.5, 160, 160);    // tiny dark lichen specks ...
      const cl = tfbm(u + 0.81, v + 0.23, 8, 2);                    // ... that clump in patches
      const pr = tfbm(u + 0.13, v + 0.59, 32, 3);                   // soft erosion pitting
      const gr = tnoise(u * 256, v * 256, 256, 256) - 0.5;          // grain
      const t = smooth(0.3, 0.7, n * 0.85 + st * 0.15);
      let r = lerp(184, 217, t), g = lerp(137, 185, t), b = lerp(90, 140, t); // #B8895A -> #D9B98C
      const wk = smooth(0.55, 0.8, w) * 0.22;
      r = lerp(r, 150, wk); g = lerp(g, 112, wk); b = lerp(b, 76, wk);
      const pk = smooth(0.58, 0.78, pr) * 0.12, sk = smooth(0.85, 0.97, sp) * 0.14 * smooth(0.46, 0.66, cl);
      const dk = 1 - pk - sk;
      r *= dk; g *= dk * 0.99; b *= dk * 0.97;
      r += gr * 12; g += gr * 10; b += gr * 9;
      const k = (j * TS + i) * 4;
      ci.data[k] = r; ci.data[k + 1] = g; ci.data[k + 2] = b; ci.data[k + 3] = 255;
      const h = 255 * clamp01(0.55 * n + 0.12 * st + 0.2 - 1.2 * pk - 0.6 * sk + 0.1 * gr);
      bi.data[k] = bi.data[k + 1] = bi.data[k + 2] = h; bi.data[k + 3] = 255;
    }
  }
  stoneC.getContext("2d").putImageData(ci, 0, 0);
  bumpC.getContext("2d").putImageData(bi, 0, 0);
}
// wall: the same stone shifted, with large weathered blocks (one tile = 2 world units, 4 courses of 2 blocks)
const wallC = makeCanvas(TS), wallBC = makeCanvas(TS);
for (const [dst, src, joint, jw, hi] of [[wallC, stoneC, "rgba(78,52,32,0.55)", 3, "rgba(255,228,186,0.10)"],
                                         [wallBC, bumpC, "rgba(0,0,0,0.9)", 4, "rgba(0,0,0,0)"]]) {
  const x = dst.getContext("2d"), ox = 371, oy = 613;
  for (const dx of [-TS, 0]) for (const dy of [-TS, 0]) x.drawImage(src, ox + dx, oy + dy);
  const ch = TS / 4, bw = TS / 2;
  x.lineCap = "round";
  for (let row = 0; row < 4; row++) {
    const y = row * ch, off = (row % 2) * bw / 2;
    const lines = row ? [[0, y, TS, y]] : [[0, 0, TS, 0], [0, TS, TS, TS]];
    for (let b = 0; b < 3; b++) { const bx = off + b * bw; lines.push([bx, y, bx, y + ch]); }
    for (const [x0, y0, x1, y1] of lines) {
      x.strokeStyle = joint; x.lineWidth = jw; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();
      x.strokeStyle = hi; x.lineWidth = 1.5; x.beginPath(); x.moveTo(x0 + 3, y0 + 3); x.lineTo(x1 + 3, y1 + 3); x.stroke();
    }
  }
}
function tex(canvas, rep, srgb) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 4;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const STONE_REP = 1 / 1.3;          // one stone tile = 1.3 world units (wheel radius = 1)
const stoneMap = tex(stoneC, STONE_REP, true), stoneBump = tex(bumpC, STONE_REP, false);
const wallMap = tex(wallC, 0.5, true), wallBump = tex(wallBC, 0.5, false);

// box-projected UVs in object space so every part gets the same texel density
function boxUV(geo, ox = 0, oy = 0) {
  const p = geo.attributes.position, n = geo.attributes.normal, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (az >= ax && az >= ay) { u = p.getX(i); v = p.getY(i); }
    else if (ay >= ax) { u = p.getX(i) + 0.31; v = p.getZ(i) + 0.17; }
    else { u = p.getZ(i) + 0.53; v = p.getY(i); }
    uv[2 * i] = u + ox; uv[2 * i + 1] = v + oy;
  }
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  return geo;
}

// ---------------------------------------------------------------- renderer / scene (transparent: the HTML sky shows)
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, alpha: true,
  premultipliedAlpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // r186 removed PCFSoftShadowMap; PCF is now the soft (vogel-disk) filter
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 60);
camera.setViewOffset(W, H, 0, H * 0.05, W, H); // wheel centre lands at y = 0.45 H

const LIFT = new THREE.Color(0.62, 0.47, 0.34); // warm bounce light, as emissive: shadowed stone never goes black
const stoneMat = new THREE.MeshStandardMaterial({ map: stoneMap, bumpMap: stoneBump, bumpScale: 1.0, roughness: 1.0, metalness: 0 });
// the wall is lifted more than the wheel so that the gaps between spokes (in rim/spoke shadow) read as a mid-tone and
// the axle's shadow on the spokes stays the darkest thing in the wheel
const wallMat = new THREE.MeshStandardMaterial({ map: wallMap, bumpMap: wallBump, bumpScale: 1.4, roughness: 1.0, metalness: 0,
  color: new THREE.Color(0.60, 0.545, 0.49), emissive: LIFT, emissiveMap: wallMap, emissiveIntensity: 0.44 });
const darkStone = stoneMat.clone(); darkStone.color = new THREE.Color(0.74, 0.675, 0.61);
darkStone.emissive = LIFT; darkStone.emissiveMap = stoneMap; darkStone.emissiveIntensity = 0.2;

function mesh(geo, mat, parent, uvOff = [0, 0]) {
  boxUV(geo, uvOff[0], uvOff[1]);
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function inst(geo, mat, parent, mats) {
  boxUV(geo);
  const m = new THREE.InstancedMesh(geo, mat, mats.length);
  mats.forEach((x, i) => m.setMatrixAt(i, x));
  m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
const M4 = (pos, rotZ = 0, scl = [1, 1, 1]) => new THREE.Matrix4().compose(new THREE.Vector3(...pos),
  new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, rotZ)), new THREE.Vector3(...scl));
function ring(rIn, rOut, front, back = 0, bevel = 0.01) { // annulus extruded from z=back to z=front
  const s = new THREE.Shape(); s.absarc(0, 0, rOut, 0, Math.PI * 2, false);
  const h = new THREE.Path(); h.absarc(0, 0, rIn, 0, Math.PI * 2, true); s.holes.push(h);
  const g = new THREE.ExtrudeGeometry(s, { depth: front - back - 2 * bevel, curveSegments: 160, bevelEnabled: bevel > 0,
    bevelThickness: bevel, bevelSize: bevel * 0.8, bevelSegments: 2 });
  return g.translate(0, 0, back + bevel);
}
function bar(pts, front, back = 0, bevel = 0.012) { // polygon (x,y) list extruded along z
  const s = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  const g = new THREE.ExtrudeGeometry(s, { depth: front - back - 2 * bevel, bevelEnabled: true, bevelThickness: bevel,
    bevelSize: bevel * 0.8, bevelSegments: 2 });
  return g.translate(0, 0, back + bevel);
}
const cylZ = (r, z0, z1, seg = 48) => new THREE.CylinderGeometry(r, r, z1 - z0, seg, 1).rotateX(Math.PI / 2).translate(0, 0, (z0 + z1) / 2);
function rope(R, r, twists, z, tubSeg = 1440, radSeg = 8) { // two-ply twisted rope moulding around the z axis
  const pos = [], idx = [];
  for (let i = 0; i <= tubSeg; i++) {
    const u = (i / tubSeg) * Math.PI * 2, cx = Math.cos(u), cy = Math.sin(u);
    for (let j = 0; j <= radSeg; j++) {
      const v = (j / radSeg) * Math.PI * 2, rr = r * (0.78 + 0.22 * Math.cos(2 * (v - twists * u)));
      pos.push((R + rr * Math.cos(v)) * cx, (R + rr * Math.cos(v)) * cy, z + rr * Math.sin(v));
    }
  }
  for (let i = 0; i < tubSeg; i++) for (let j = 0; j < radSeg; j++) {
    const a = i * (radSeg + 1) + j, b = a + radSeg + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}

// ---------------------------------------------------------------- the plinth wall (ends in a cornice + parapet)
const world = new THREE.Group(); scene.add(world);
const wall = new THREE.Mesh(boxUV(new THREE.PlaneGeometry(14, 10).translate(0, WALL_TOP - 5, 0), 0.37, 0.21), wallMat);
wall.receiveShadow = true; world.add(wall);
const moldings = [ // [yCenter, height, depth]
  [-1.085, 0.11, 0.30], [-1.44, 0.09, 0.24], [-1.535, 0.06, 0.15], [1.095, 0.035, 0.08], [WALL_TOP - 0.05, 0.10, 0.20]];
for (const [y, h, d] of moldings) mesh(new THREE.BoxGeometry(14, h, d).translate(0, y, d / 2), darkStone, world, [0.2, y]);
{ // parapet: small blocks with a flattened amalaka cap, silhouetted against the sky
  const base = [], cap = [], fin = [];
  for (let i = -16; i <= 16; i++) {
    const x = i * 0.25;
    base.push(M4([x, WALL_TOP + 0.025, 0.1]));
    cap.push(M4([x, WALL_TOP + 0.058, 0.1], 0, [1, 0.45, 1]));
    fin.push(M4([x, WALL_TOP + 0.098, 0.1]));
  }
  inst(new THREE.BoxGeometry(0.12, 0.05, 0.11), darkStone, world, base);
  inst(new THREE.SphereGeometry(0.062, 20, 10), darkStone, world, cap);
  inst(new THREE.ConeGeometry(0.018, 0.046, 10), darkStone, world, fin);
}
// carved frieze between the base mouldings: blocks alternating with round bosses
{
  const blocks = [], bosses = [];
  for (let i = -30; i <= 30; i++) {
    blocks.push(M4([i * 0.24, -1.29, 0.05], 0, [1, 1, 1]));
    bosses.push(M4([i * 0.24 + 0.12, -1.29, 0.03], 0, [1, 1, 0.55]));
  }
  inst(new THREE.BoxGeometry(0.13, 0.19, 0.10), darkStone, world, blocks);
  inst(new THREE.SphereGeometry(0.045, 16, 12), darkStone, world, bosses);
}

// ---------------------------------------------------------------- the wheel (radius 1, face towards +z)
const wheel = new THREE.Group(); world.add(wheel);
const RIN = 0.80;                         // inner edge of the rim = where spokes end
mesh(ring(0.885, 1.0, 0.165), stoneMat, wheel);        // outer band
mesh(ring(0.855, 0.887, 0.11, 0, 0.006), darkStone, wheel); // groove
mesh(ring(RIN - 0.01, 0.857, 0.152), stoneMat, wheel); // inner band
mesh(rope(0.815, 0.014, 90, 0.152), stoneMat, wheel);  // twisted rope moulding on the inner band
{
  const beads = [], dent = [], base = [], pet = [], cen = [];
  for (let i = 0; i < 120; i++) { const a = (i / 120) * Math.PI * 2; beads.push(M4([Math.cos(a) * 0.975, Math.sin(a) * 0.975, 0.16], 0, [1, 1, 0.7])); }
  for (let i = 0; i < 110; i++) { const a = (i / 110) * Math.PI * 2; dent.push(M4([Math.cos(a) * 0.871, Math.sin(a) * 0.871, 0.11], a)); }
  for (let i = 0; i < 56; i++) { // lotus rosettes on the outer band: back plate + 8 petals + seed
    const a = ((i + 0.5) / 56) * Math.PI * 2, R = M4([Math.cos(a) * 0.929, Math.sin(a) * 0.929, 0], a);
    base.push(R.clone().multiply(M4([0, 0, 0.1655])));
    for (let k = 0; k < 8; k++) { const b = (k / 8) * Math.PI * 2 + (i % 2) * Math.PI / 8;
      pet.push(R.clone().multiply(M4([Math.cos(b) * 0.0175, Math.sin(b) * 0.0175, 0.1685], b - Math.PI / 2))); }
    cen.push(R.clone().multiply(M4([0, 0, 0.171], 0, [1, 1, 0.6])));
  }
  inst(new THREE.SphereGeometry(0.019, 12, 8), stoneMat, wheel, beads);
  inst(new THREE.BoxGeometry(0.03, 0.017, 0.04), stoneMat, wheel, dent);
  inst(cylZ(0.032, -0.004, 0.004, 24), stoneMat, wheel, base);

// ---------------------------------------------------------------- lights
const sun = new THREE.DirectionalLight(0xffd29a, 8.5);
sun.castShadow = true;
sun.shadow.mapSize.set(3072, 3072);
Object.assign(sun.shadow.camera, { left: -1.55, right: 1.55, top: 1.55, bottom: -1.55, near: 1, far: 14 });

sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.012; sun.shadow.radius = 2.0;

scene.add(new THREE.HemisphereLight(0xaebfe6, 0x6e4f34, 0.95));
const fill = new THREE.DirectionalLight(0x9fb6e6, 0.55); fill.position.set(2.5, -1.5, 6); scene.add(fill);
const LOW = new THREE.Color(0xffc290), HIGH = new THREE.Color(0xffe4c0);

// Fit the (orthographic) shadow camera to exactly what the view camera sees of the wall, every frame. A caster and
// the shadow it throws share light-space x/y, so covering the visible receivers is enough: no clipped shadows at the
// frame edges, and no texels wasted off-screen.
const _p = new THREE.Vector3(), _q = new THREE.Vector3(), _h = new THREE.Vector3();
function fitShadow() {
  sun.updateMatrixWorld(); sun.target.updateMatrixWorld();

  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const [nx, ny] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    _p.set(nx, ny, -1).unproject(camera); _q.set(nx, ny, 1).unproject(camera).sub(_p);
    for (const z of [0, 0.56]) {
      _h.copy(_p).addScaledVector(_q, (z - _p.z) / _q.z);
      _h.y = Math.min(_h.y, WALL_TOP + 0.2);
      _h.applyMatrix4(inv);
      x0 = Math.min(x0, _h.x); x1 = Math.max(x1, _h.x); y0 = Math.min(y0, _h.y); y1 = Math.max(y1, _h.y);
    }
  }
  const m = 0.05;
  Object.assign(sc, { left: x0 - m, right: x1 + m, bottom: y0 - m, top: y1 + m });
  sc.updateProjectionMatrix();
}

// ---------------------------------------------------------------- framing
const tanH = Math.tan((FOV / 2) * D2R) * (W / H);  // half-width per unit distance
const DIST_FRONT = 1.0 / (0.85 * tanH);            // wheel ~85 % of frame width, front-on
const YAW0 = 21, YAW1 = 16;
const DIST_SWEEP = Math.cos(18.5 * D2R) * 1.0 / (0.86 * tanH);
function placeCamera(t) {
  const k = clamp01(t / CFG.duration), e = k * k * (3 - 2 * k);
  if (MODE === "sweep") {
    const yaw = lerp(YAW0, YAW1, e) * D2R, pitch = lerp(5, 3, e) * D2R, d = DIST_SWEEP * (1 - 0.03 * e);
    camera.position.set(Math.sin(yaw) * Math.cos(pitch) * d, Math.sin(pitch) * d, 0.15 + Math.cos(yaw) * Math.cos(pitch) * d);
  } else {
    camera.position.set(0, 0, 0.15 + DIST_FRONT * (1 - 0.015 * e));

const sunB = document.getElementById("sunB"), sunF = document.getElementById("sunF");
function sunScreen(phi) { // arc across the sky; at +-90 deg it sits just above the parapet line (rising / setting)
  const x = 540 + 470 * Math.sin(phi);
  const [ax, ay] = toScreen(-3, WALL_TOP, 0.2), [bx, by] = toScreen(3, WALL_TOP, 0.2);
  const yH = ay + (by - ay) * (x - ax) / (bx - ax) - 16, yNoon = 160;

}

else {

// ---------------------------------------------------------------- deterministic frame
function sunAngle(t) {
