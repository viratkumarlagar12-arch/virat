<!-- "Mercury is closest to the Sun... but the hottest planet is Venus": an orrery seen from above-and-ahead in warm golden
     light (to match the Venus-surface AI footage). Three.js inside HyperFrames, CPU-renderable, deterministic, a pure function of t.
     Procedural everything: cratered Mercury (crater splats -> height -> normal map), cloud-banded Venus with a drifting haze layer
     and a glowing atmosphere, a granulated Sun with corona rays, thin glowing orbit rings with a bright trail behind each planet,
     stars on a warm dust dome. The two thermometers are DOM elements (glass tube + bulb, red fill) driven from t, same scale for both
     (0 to scaleMax degrees C), so 430 vs 465 is honestly a small difference; Venus's tube has a dashed tick at Mercury's level.
     Beats (CFG.ab / CFG.bc are camera moves, absolute seconds):
       0.0 - 1.7   camera on Mercury (close, tracking it); its thermometer fills 0.25 -> 1.25 to "~430°C" (pops 1.05), small label "MERCURY (DIN MEIN)".
       1.5 - 2.15  camera pulls back / pans down to the wide shot (Sun top-left, Mercury upper-middle, Venus lower-middle/right).
       1.95 - 2.9  Venus's thermometer appears and rises past Mercury's level (dashed tick, passed at ~2.65), turns hot red, "~465°C" pops 2.82.
       2.95 - 3.2  Mercury, its thermometer and its tag cross-fade out (gone before the word).
       2.9 - 4.2   camera pushes in on Venus (Venus is locked to a monotonic screen path, eases out toward the cut); Venus glows warmer
                   from 2.75; the big word "VENUS" pops at CFG.word (3.15).
     Layout: y 1250-1450 px is kept free of key detail (captions go there): planets, bulbs and tags stay above y 1250 in every beat
     (only the fast pull-back at 1.8-2.1 passes through, with the new thermometer still faint). Only text: the labels above.
     Settings: the one-line window.CFG below; render3d.py --config '{"merc":430}' merges JSON over it.
       duration, merc / venus (degrees C shown), scaleMax (top of the tube), tB (time of the wide-shot layout), ab / bc (camera move
       windows), word (time the VENUS word pops), seed. -->

window.CFG = { duration: 4.2, merc: 430, venus: 465, scaleMax: 500, tB: 2.4, ab: [1.5, 2.15], bc: [2.9, 4.5], word: 3.15, seed: 5 };
</script>

<script type="module">
import * as THREE from "three";

const CFG = window.CFG;
const W = 1080, H = 1920, FOV = 28, D2R = Math.PI / 180;
const TT = CFG.duration;
const PXK = (H / 2) / Math.tan(FOV / 2 * D2R);          // pixels per world unit at distance 1
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const smoother = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * t * (t * (t * 6 - 15) + 10); };
const easeOutCubic = (u) => 1 - Math.pow(1 - clamp01(u), 3);
const easeOutQuad = (u) => 1 - Math.pow(1 - clamp01(u), 2);
const backOut = (u, s = 1.9) => { u = clamp01(u) - 1; return 1 + (s + 1) * u * u * u + s * u * u; };
let seed = 424242 + (CFG.seed | 0) * 7919;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// ---------------------------------------------------------------- seeded 3D value noise (static textures only)
const P = new Uint8Array(512);
for (let i = 0; i < 256; i++) P[i] = i;
for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [P[i], P[j]] = [P[j], P[i]]; }
for (let i = 0; i < 256; i++) P[i + 256] = P[i];
const fade = (t) => t * t * (3 - 2 * t);
function vnoise(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const u = fade(x), v = fade(y), w = fade(z);
  const h = (a, b, c) => P[P[P[a] + b] + c] / 255;
  const l = (a, b, t) => a + (b - a) * t;
  return l(l(l(h(X, Y, Z), h(X + 1, Y, Z), u), l(h(X, Y + 1, Z), h(X + 1, Y + 1, Z), u), v),
           l(l(h(X, Y, Z + 1), h(X + 1, Y, Z + 1), u), l(h(X, Y + 1, Z + 1), h(X + 1, Y + 1, Z + 1), u), v), w);
}
function fbm(x, y, z, oct = 5) {

  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f); f *= 2; a *= 0.5; }
  return s;
}

// ---------------------------------------------------------------- sphere texture grids (same mapping as THREE.SphereGeometry)
function makeGrid(w, h) {
  const X = new Float32Array(w * h), Y = new Float32Array(w * h), Z = new Float32Array(w * h);
  for (let j = 0; j < h; j++) {
    const th = Math.PI * (j + 0.5) / h, st = Math.sin(th), ct = Math.cos(th);
    for (let i = 0; i < w; i++) {
      const ph = 2 * Math.PI * (i + 0.5) / w, k = j * w + i;
      X[k] = -Math.cos(ph) * st; Y[k] = ct; Z[k] = Math.sin(ph) * st;
    }

}
function toTexture(w, h, data, srgbWrap = true) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"); const img = ctx.createImageData(w, h);
  img.data.set(data); ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.NoColorSpace; t.anisotropy = 4; t.wrapS = THREE.RepeatWrapping;
  return t;
}
const c8 = (v) => (v < 0 ? 0 : v > 1 ? 255 : (v * 255 + 0.5) | 0);

// ---- Mercury: crater splats (power-law sizes, bowl + rim + apron + central peak, a few ray systems) -> height -> normal map
function genMercury() {
  const G = makeGrid(1024, 512), { w, h, X, Y, Z } = G, n = w * h;
  const hgt = new Float32Array(n), alb = new Float32Array(n);
  for (let k = 0; k < n; k++) {
    hgt[k] = 0.010 * (fbm(X[k] * 2.3 + 5, Y[k] * 2.3, Z[k] * 2.3, 5) - 0.5) + 0.0035 * (fbm(X[k] * 11 + 2, Y[k] * 11, Z[k] * 11, 3) - 0.5);
    alb[k] = 1;
  }
  const cr = [], rmin = 0.021, rmax = 0.36, NC = 820;
  for (let i = 0; i < NC; i++) {
    const u = rnd(), rho = rmin / Math.sqrt(1 - u * (1 - (rmin / rmax) * (rmin / rmax)));
    const z = rnd() * 2 - 1, a = rnd() * Math.PI * 2, s = Math.sqrt(1 - z * z);
    cr.push({ rho, cx: s * Math.cos(a), cy: z, cz: s * Math.sin(a), fresh: rnd() < 0.16, rs: rnd() * 10 });
  }
  cr.sort((a, b) => b.rho - a.rho);
  const rayers = cr.filter((c) => c.rho > 0.05 && c.fresh).slice(0, 7);
  const sm = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  for (const c of cr) {
    const rho = c.rho, ext = rho * 1.8, depth = 0.22 * rho / (1 + rho * 5.5);
    splat(c, ext, (k, q) => {
      if (q < 1) {
        hgt[k] -= depth * (1 - q * q) * (q < 0.35 && rho > 0.1 ? 0.8 : 1);
        alb[k] *= 1 - (rho > 0.09 ? 0.16 : 0.07) * (1 - q * q);
        if (rho > 0.1) hgt[k] += 0.38 * depth * Math.exp(-(q / 0.11) * (q / 0.11));
      }
      const rim = Math.exp(-((q - 1.0) / 0.1) * ((q - 1.0) / 0.1));
      hgt[k] += 0.34 * depth * rim;
      if (q > 1) hgt[k] += 0.06 * depth * Math.exp(-(q - 1) / 0.55);
      alb[k] *= 1 + 0.12 * rim + (c.fresh && q > 1 ? 0.18 * Math.exp(-(q - 1) / 0.7) : 0);
    });
  }
  function splat(c, ext, fn) {
    const th0 = Math.acos(c.cy), cosExt = Math.cos(Math.min(ext, Math.PI));
    const j0 = Math.max(0, Math.floor((th0 - ext) / Math.PI * h)), j1 = Math.min(h - 1, Math.ceil((th0 + ext) / Math.PI * h));
    const ph0 = (Math.atan2(c.cz, -c.cx) + 2 * Math.PI) % (2 * Math.PI), i0 = Math.floor(ph0 / (2 * Math.PI) * w);
    const pole = th0 - ext < 0 || th0 + ext > Math.PI;
    for (let j = j0; j <= j1; j++) {
      const s = Math.sin(Math.PI * (j + 0.5) / h);
      const dph = pole ? Math.PI : Math.min(Math.PI, ext / Math.max(s, 1e-3));
      const di = Math.min(w / 2, Math.ceil(dph / (2 * Math.PI) * w) + 1);
      for (let i = i0 - di; i <= i0 + di; i++) {
        const k = j * w + ((i % w) + w) % w;
        const d = c.cx * X[k] + c.cy * Y[k] + c.cz * Z[k];
        if (d < cosExt) continue;
        fn(k, Math.acos(Math.min(1, d)) / c.rho);
      }
    }
  }
  for (const c of rayers) { // bright ray systems from a few young craters
    const ref = Math.abs(c.cy) < 0.9 ? [0, 1, 0] : [1, 0, 0];
    let e1 = [c.cy * ref[2] - c.cz * ref[1], c.cz * ref[0] - c.cx * ref[2], c.cx * ref[1] - c.cy * ref[0]];
    const l1 = Math.hypot(...e1); e1 = e1.map((v) => v / l1);
    const e2 = [c.cy * e1[2] - c.cz * e1[1], c.cz * e1[0] - c.cx * e1[2], c.cx * e1[1] - c.cy * e1[0]];
    splat(c, c.rho * 7, (k, q) => {
      if (q < 1.15) return;
      const dx = X[k], dy = Y[k], dz = Z[k], dd = c.cx * dx + c.cy * dy + c.cz * dz;
      const px = dx - dd * c.cx, py = dy - dd * c.cy, pz = dz - dd * c.cz;
      const ang = Math.atan2(px * e2[0] + py * e2[1] + pz * e2[2], px * e1[0] + py * e1[1] + pz * e1[2]);
      const r = Math.max(0, Math.sin(ang * 13 + c.rs) * Math.sin(ang * 5.3 + c.rs * 2.1)), ray = r * r * r;
      alb[k] *= 1 + 0.34 * ray * Math.exp(-(q - 1) / 3.2) * sm(1.15, 1.6, q);
    });
  }
  const A = new Uint8ClampedArray(n * 4), N = new Uint8ClampedArray(n * 4);
  const dPh = 2 * Math.PI / w, dTh = Math.PI / h;
  for (let j = 0; j < h; j++) {
    const s = Math.max(Math.sin(Math.PI * (j + 0.5) / h), 0.04);
    for (let i = 0; i < w; i++) {
      const k = j * w + i, kE = j * w + ((i + 1) % w), kW = j * w + ((i + w - 1) % w);
      const kN = Math.max(0, j - 1) * w + i, kS = Math.min(h - 1, j + 1) * w + i;
      const sx = (hgt[kE] - hgt[kW]) / (2 * dPh * s), sy = (hgt[kN] - hgt[kS]) / (2 * dTh);
      let nx = -sx * 1.7, ny = -sy * 1.7, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
      N[k * 4] = c8(nx * 0.5 + 0.5); N[k * 4 + 1] = c8(ny * 0.5 + 0.5); N[k * 4 + 2] = c8(nz * 0.5 + 0.5); N[k * 4 + 3] = 255;
      const var1 = 0.9 + 0.2 * fbm(X[k] * 3.4 + 20, Y[k] * 3.4, Z[k] * 3.4, 4), patch = 0.88 + 0.16 * sm(0.42, 0.62, fbm(X[k] * 1.3 + 40, Y[k] * 1.3 + 3, Z[k] * 1.3, 3));
      const m = alb[k] * var1 * patch;
      A[k * 4] = c8(0.50 * m); A[k * 4 + 1] = c8(0.465 * m); A[k * 4 + 2] = c8(0.43 * m); A[k * 4 + 3] = 255;
    }
  }
  return { albedo: toTexture(w, h, A), normal: toTexture(w, h, N) };
}

// ---- Venus: pale yellow-cream, latitude-banded, domain-warped cloud swirls; plus a thin drifting haze layer
function genVenus() {
  const G = makeGrid(1024, 512), { w, h, X, Y, Z } = G, n = w * h, A = new Uint8ClampedArray(n * 4);
  const sm = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  for (let k = 0; k < n; k++) {
    const x = X[k], y = Y[k], z = Z[k];
    const wx = fbm(x * 2 + 3, y * 2, z * 2, 4) - 0.5, wy = fbm(x * 2 + 11, y * 2 + 5, z * 2, 4) - 0.5, wz = fbm(x * 2 + 19, y * 2, z * 2 + 7, 4) - 0.5;
    const band = 0.5 + 0.5 * Math.sin(Math.asin(y) * 9 + 3.2 * wy + 1.1);
    const sw = fbm(x * 1.5 + wx * 1.4 + 31, y * 5.5 + wy * 1.6, z * 1.5 + wz * 1.4, 6);
    const fine = fbm(x * 4 + wx * 2.2 + 60, y * 15 + wy * 2, z * 4 + wz * 2.2, 4) - 0.5;
    const v = clamp01(0.55 * sw * 1.5 + 0.38 * band - 0.1 + 0.26 * fine);
    const t1 = sm(0.28, 0.72, v), t2 = sm(0.68, 0.92, v);
    let r = lerp(0.80, 0.97, t1), g = lerp(0.62, 0.90, t1), b = lerp(0.34, 0.66, t1);
    r = lerp(r, 1.0, t2 * 0.6); g = lerp(g, 0.97, t2 * 0.6); b = lerp(b, 0.84, t2 * 0.6);
    const pol = sm(0.78, 0.98, Math.abs(y)); r *= 1 - 0.1 * pol; g *= 1 - 0.14 * pol; b *= 1 - 0.2 * pol;
    A[k * 4] = c8(r); A[k * 4 + 1] = c8(g); A[k * 4 + 2] = c8(b); A[k * 4 + 3] = 255;
  }
  const G2 = makeGrid(512, 256), n2 = G2.w * G2.h, B = new Uint8ClampedArray(n2 * 4);
  for (let k = 0; k < n2; k++) {
    const x = G2.X[k], y = G2.Y[k], z = G2.Z[k];
    const c = fbm(x * 2.2 + 70 + 0.8 * fbm(x * 3, y * 3, z * 3, 3), y * 6 + 0.5, z * 2.2 + 9, 5);
    B[k * 4] = 255; B[k * 4 + 1] = 245; B[k * 4 + 2] = 215; B[k * 4 + 3] = c8(sm(0.5, 0.78, c) * 0.55);
  }
  return { albedo: toTexture(w, h, A), haze: toTexture(G2.w, G2.h, B) };
}

// ---- Sun granulation (brightness multiplier in R) and the warm dust dome
function genSun() {
  const G = makeGrid(1024, 512), { w, h, X, Y, Z } = G, n = w * h, A = new Uint8ClampedArray(n * 4);
  for (let k = 0; k < n; k++) {
    const g = fbm(X[k] * 30, Y[k] * 30, Z[k] * 30, 3), l = fbm(X[k] * 5 + 9, Y[k] * 5, Z[k] * 5, 4);
    const v = clamp01(0.25 + g * 0.9 + (l - 0.5) * 0.5);
    A[k * 4] = c8(v); A[k * 4 + 1] = c8(v); A[k * 4 + 2] = c8(v); A[k * 4 + 3] = 255;
  }
  return toTexture(w, h, A);
}
function genDust() {
  const G = makeGrid(768, 384), { w, h, X, Y, Z } = G, n = w * h, A = new Uint8ClampedArray(n * 4);
  for (let k = 0; k < n; k++) {
    const x = X[k], y = Y[k], z = Z[k];
    const a = fbm(x * 4.5 + 5, y * 4.5, z * 4.5, 5), b = fbm(x * 9 + 50, y * 9 + 2, z * 9, 4);
    const c = Math.pow(clamp01((a - 0.38) * 2.2), 1.6) * (0.5 + 0.7 * b);
    const r = 0.026 + 0.15 * c, g = 0.014 + 0.066 * c, bl = 0.009 + 0.03 * c;
    A[k * 4] = c8(r); A[k * 4 + 1] = c8(g); A[k * 4 + 2] = c8(bl); A[k * 4 + 3] = 255;
  }
  return toTexture(w, h, A);
}
const mercTex = genMercury(), venTex = genVenus(), sunTex = genSun(), dustTex = genDust();

// ---------------------------------------------------------------- renderer / scene / camera
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x0a0503, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.5, 400);
const AZ0 = -0.38, EL0 = 50 * D2R, D0 = 40;
const dirOf = (az, el) => new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
function placeCamera(T, D, sx, sy, az) {
  camera.position.copy(T).addScaledVector(dirOf(az, EL0), D);
  camera.up.set(0, 1, 0); camera.lookAt(T);
  camera.setViewOffset(W, H, -sx, -sy, W, H);
  camera.updateMatrixWorld(true);
}
function unprojectToPlane(px, py) {
  const v = new THREE.Vector3((px / W) * 2 - 1, -((py / H) * 2 - 1), 0.5).unproject(camera);
  const d = v.sub(camera.position).normalize(), t = -camera.position.y / d.y;
  return camera.position.clone().addScaledVector(d, t);
}
function screenOf(p) { const v = p.clone().project(camera); return new THREE.Vector2((v.x * 0.5 + 0.5) * W, (-v.y * 0.5 + 0.5) * H); }
function depthOf(p) { return -p.clone().applyMatrix4(camera.matrixWorldInverse).z; }

// ---- layout of the wide shot (screen px) -> world positions, orbit radii, planet sizes

  atmoMat.uniforms.uK.value = lerp(0.8, 1.7, warm); atmoMat.uniforms.uW.value = lerp(0.085, 0.14, warm);
  { let ux = sunPx.x - vPx.x, uy = -(sunPx.y - vPx.y); const l = Math.hypot(ux, uy) || 1; atmoMat.uniforms.uSun.value.set(ux / l, uy / l); }
  renderer.render(scene, camera);

  // ---- thermometers + word (DOM), anchored to the planets' projected positions
  const lvlM0 = CFG.merc / CFG.scaleMax, lvlV0 = CFG.venus / CFG.scaleMax;
  // Mercury: appears at once, fills 0.25 -> 1.25 s with a small settle, tag pops as it fills
  const fM = easeOutCubic((t - 0.25) / 1.0), setM = t > 1.25 ? 0.006 * Math.sin((t - 1.25) * 20) * Math.exp(-(t - 1.25) * 6) : 0;
  const mOp = smooth(0, 0.3, t) * (1 - smooth(2.95, 3.2, t));
  const mx = Math.min(900, mPx.x + mR + 175), mBot = mPx.y + 205 + 24 * (1 - smooth(0, 0.35, t));
  const mTagU = (t - 1.05) / 0.38;
  setThermo(thM, { x: mx, bottom: mBot, op: mOp, lvl: lvlM0 * fM + setM, hot: "#ff6a2e", glow: "rgba(255,100,40,.55)",
    tagOp: clamp01((t - 1.05) / 0.12), tagS: 0.5 + 0.5 * backOut(mTagU), labOp: smooth(0.45, 0.8, t) });
  // Venus: appears 1.75, rises 1.95 -> 2.9 past Mercury's level (the dashed tick), goes hot red, tag pops at the top
  const fV = easeOutQuad((t - 2.05) / 0.85), hot = smooth(2.3, 2.95, t);
  const vOp = smooth(1.95, 2.25, t);
  const vx = Math.max(160, vPx.x - vR - 135), vBot = vPx.y + 160 + 24 * (1 - smooth(1.95, 2.3, t));
  const vTagU = (t - 2.82) / 0.38;
  thV.ref.style.opacity = (smooth(2.05, 2.3, t) * (1 - smooth(3.0, 3.3, t)) * 0.95).toFixed(3);
  setThermo(thV, { x: vx, bottom: vBot, op: vOp, lvl: lvlV0 * fV, hot: rgb(mix3([255, 106, 46], [255, 24, 28], hot)), glow: "rgba(255," + Math.round(lerp(100, 30, hot)) + ",30," + lerp(0.55, 0.95, hot).toFixed(2) + ")",
    tagOp: clamp01((t - 2.82) / 0.12), tagS: 0.5 + 0.5 * backOut(vTagU), labOp: 0 });
  // the big word: pops above Venus
  const wu = (t - CFG.word) / 0.4, wS = 0.55 + 0.45 * backOut(wu) + 0.035 * clamp01((t - CFG.word - 0.4) / 0.8);
  wordEl.style.top = "330px";
  wordEl.style.opacity = clamp01((t - CFG.word) / 0.1).toFixed(3); wordEl.style.transform = "scale(" + wS.toFixed(4) + ")";
}
window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
renderAt(window.__hfThreeTime || 0);
window.__sceneReady = true;
</script>
