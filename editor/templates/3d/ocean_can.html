<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Ocean can crush 3D</title>
<!-- "92x Earth's pressure = ~900 m under the sea": an empty, sealed, unbranded drink can sinks with the camera through
     the ocean and is crushed by the water pressure (Three.js inside HyperFrames, CPU-renderable, deterministic).
     0 s: bright blue water just under the surface (shimmering surface at the very top, light shafts). The camera sinks
     with the can; marine snow streams upward past the lens (motion-streaked, defocused near the lens) and the water
     darkens to deep navy. Just before crushStart the wall flexes ("oil-canning"); crushStart..crushEnd: the can implodes —
     three dents start at mid-height one after another and spread towards the ends, the whole body is squeezed and
     twisted, creases form (vertex displacement on a 168 x 170 grid), the can shortens and kinks; camera jolt; a burst of
     bubbles from a ruptured fold (mostly towards the camera) plus a fizz from the other folds. The descent slows during
     the crush (so the bubbles read) and resumes after it. Ends crumpled, sinking into the dark.
     Everything procedural and seeded (HDR underwater environment with Snell's window, can textures, particles):
     a pure function of t. Layout: can centred around y 900-1300 px; the band y 150-520 px stays calm (depth counter goes
     there: the snow and bubbles are thinned there, nothing else is drawn); no text.
     Settings: the one-line window.CFG below; render3d.py --config '{"band":"#1d6fd1"}' merges JSON over it.
       duration, crushStart, crushEnd (absolute seconds), band (paint colour of the can's band, CSS hex), seed. -->
<script>
window.CFG = { duration: 2.8, crushStart: 1.5, crushEnd: 2.1, band: "#e8601a", seed: 3 };
</script>
<script src="assets/gsap.min.js"></script>
<script type="importmap">{ "imports": { "three": "./assets/three.module.js" } }</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #062440; }
#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
#vig { position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 100% 78% at 50% 58%, rgba(0,0,0,0) 60%, rgba(0,5,14,0.5) 100%),
    linear-gradient(to bottom, rgba(0,6,16,0) 0%, rgba(0,6,16,0) 70%, rgba(0,4,12,0.42) 100%); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2.8" data-width="1080" data-height="1920">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="vig"></div>
</div>
<script>
  (function () {
    const C = window.CFG;
    document.getElementById("root").setAttribute("data-duration", String(C.duration));
    const tl = gsap.timeline({ paused: true });
    tl.set({}, {}, C.duration); // timeline length == composition length
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
  })();
</script>
<script type="module">
import * as THREE from "three";

const CFG = window.CFG;
const W = 1080, H = 1920, FOV = 30, D2R = Math.PI / 180;
const TT = CFG.duration, C0 = CFG.crushStart, C1 = CFG.crushEnd;
const PXK = (H / 2) / Math.tan(FOV / 2 * D2R);       // pixels per world unit at distance 1
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 918273 + (CFG.seed | 0) * 7919;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// ---------------------------------------------------------------- seeded 3D value noise (static detail only)
const P = new Uint8Array(512);
for (let i = 0; i < 256; i++) P[i] = i;
for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [P[i], P[j]] = [P[j], P[i]]; }
for (let i = 0; i < 256; i++) P[i + 256] = P[i];
const fade = (t) => t * t * (3 - 2 * t);
function vnoise(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const u = fade(x), v = fade(y), w = fade(z);
  const h = (a, b, c) => P[P[P[a] + b] + c] / 255;
  const l = (a, b, t) => a + (b - a) * t;
  return l(l(l(h(X, Y, Z), h(X + 1, Y, Z), u), l(h(X, Y + 1, Z), h(X + 1, Y + 1, Z), u), v),
           l(l(h(X, Y, Z + 1), h(X + 1, Y, Z + 1), u), l(h(X, Y + 1, Z + 1), h(X + 1, Y + 1, Z + 1), u), v), w);
}
function fbm(x, y, z, oct) { let a = 0.5, f = 1, s = 0, n = 0; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f); n += a; f *= 2.03; a *= 0.5; } return s / n; }

// ---------------------------------------------------------------- descent (camera sinks with the can)
// speed in cm/s of this (scaled) world: slows right down while the can implodes so the bubble burst reads, then resumes.
function vel(t) {
  const ramp = 0.55 + 0.45 * smooth(0, 0.45, t);
  const slow = 1 - 0.82 * smooth(C0 - 0.3, C0 + 0.04, t) * (1 - smooth(C1 - 0.05, C1 + 0.45, t));
  return 46 * ramp * slow;
}
function descent(t) { // integral of vel, fixed steps: deterministic for any t
  const n = Math.max(1, Math.ceil(t / 0.004)), h = t / n; let s = 0;
  for (let i = 0; i < n; i++) s += vel((i + 0.5) * h);
  return s * h;
}
const DT = descent(TT);
// how deep we look: half descent, half time (a linear 0 -> 900 m counter stays in step)
const depthK = (t) => clamp01(0.5 * descent(t) / DT + 0.5 * t / TT);

// ---------------------------------------------------------------- renderer / scene / camera
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, W / H, 1, 3000);
scene.add(camera);
scene.fog = new THREE.FogExp2(0x0b4a78, 0.0038);

// ---------------------------------------------------------------- underwater HDR environment (reflections on the metal)
// Looking up from under water you see the sky squeezed into Snell's window (a bright disc ~48.6 deg around the zenith,
// sun inside it); outside it the water is dark. Soft vertical light shafts near the horizon behind the camera give the
// metal its silver streaks. Linear float data, so highlights can be much brighter than the water.
function envTexture() {
  const w = 512, h = 256, data = new Float32Array(w * h * 4);
  const sunDir = new THREE.Vector3(0.22, 1, 0.12).normalize();
  for (let j = 0; j < h; j++) {
    const el = ((j + 0.5) / h - 0.5) * Math.PI;              // row 0 = straight down (DataTexture is not flipped)
    for (let i = 0; i < w; i++) {
      const u = (i + 0.5) / w, ph = u * 2 * Math.PI;         // three's equirect: u = atan2(z, x) / 2pi + 0.5
      const az = ph - Math.PI;
      const dx = Math.cos(el) * Math.cos(az), dz = Math.cos(el) * Math.sin(az), dy = Math.sin(el);
      const zen = Math.acos(Math.max(-1, Math.min(1, dy))) / D2R;
      let r, g, b;
      if (dy >= 0) { const k = Math.pow(dy, 0.8); r = lerp(0.02, 0.05, k); g = lerp(0.13, 0.27, k); b = lerp(0.26, 0.45, k); }
      else { const k = Math.pow(-dy, 0.5); r = lerp(0.03, 0.006, k); g = lerp(0.16, 0.05, k); b = lerp(0.3, 0.11, k); }
      // broad, soft, nearly neutral light panels round the horizon: the can's bare aluminium then reflects silver-grey
      // gradients (blue only in its shadows) instead of reading as blue paint
      const hz = Math.exp(-Math.pow((el - 0.1) / 0.55, 2)), pan = hz * (0.5 + 0.5 * fbm(dx * 2.6 + 9, dz * 2.6, 4.2, 2));
      r += pan * 0.42; g += pan * 0.52; b += pan * 0.6;
      const rip = 0.75 + 0.5 * fbm(dx * 5 + 3, dz * 5, 1.5, 3);
      const win = (1 - smooth(45, 49.5, zen)) * rip;
      const rim = Math.exp(-Math.pow((zen - 47.5) / 2.0, 2));
      const cs = dx * sunDir.x + dy * sunDir.y + dz * sunDir.z, sa = Math.acos(Math.min(1, cs)) / D2R;
      const sun = Math.exp(-Math.pow(sa / 4, 2)) * 22 + Math.exp(-Math.pow(sa / 14, 2)) * 2.0;
      r += win * 0.95 + rim * 0.9 + sun * 1.0; g += win * 1.3 + rim * 1.15 + sun * 0.98; b += win * 1.5 + rim * 1.25 + sun * 0.92;
      const sh = (cu, wd) => { let d = Math.abs(u - cu); d = Math.min(d, 1 - d); return Math.exp(-Math.pow(d / wd, 2)); };
      const vfall = smooth(-0.3, 0.15, dy) * (1 - 0.6 * smooth(0.45, 0.95, dy));
      const shafts = (sh(0.67, 0.03) * 1.6 + sh(0.84, 0.022) * 1.1 + sh(0.32, 0.045) * 0.7 + sh(0.12, 0.03) * 0.5) * vfall;
      r += shafts * 0.9; g += shafts * 1.2; b += shafts * 1.35;
      const k4 = (j * w + i) * 4;
      data[k4] = r; data[k4 + 1] = g; data[k4 + 2] = b; data[k4 + 3] = 1;
    }
  }
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.FloatType);
  t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.LinearSRGBColorSpace;
  t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; t.needsUpdate = true;
  return t;
}
scene.environment = envTexture();

// ---------------------------------------------------------------- background water (full-screen shader, display colours)
const bgMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: { uTop: { value: new THREE.Vector3() }, uMid: { value: new THREE.Vector3() }, uBot: { value: new THREE.Vector3() },
    uRayCol: { value: new THREE.Vector3(0.98, 0.97, 0.88) }, uRay: { value: 1 }, uSurf: { value: 0.94 }, uT: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform vec3 uTop, uMid, uBot, uRayCol; uniform float uRay, uSurf, uT; varying vec2 vUv;
    float h1(float n){ return fract(sin(n * 12.9898) * 43758.5453); }
    float n1(float x){ float i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f); return mix(h1(i), h1(i + 1.0), f); }
    float h2(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(h2(i), h2(i + vec2(1.0, 0.0)), f.x), mix(h2(i + vec2(0.0, 1.0)), h2(i + vec2(1.0, 1.0)), f.x), f.y); }
    void main(){
      vec2 uv = vUv;
      vec3 col = uv.y > 0.5 ? mix(uMid, uTop, pow((uv.y - 0.5) * 2.0, 1.15)) : mix(uBot, uMid, pow(uv.y * 2.0, 0.85));
      // light shafts fanning down from the surface (source above the frame, a little right of centre)
      vec2 d = vec2((uv.x - 0.6) * 0.5625, uv.y - 1.32);
      float ang = atan(d.x, -d.y), r = length(d);
      float s = pow(n1(ang * 21.0 + uT * 0.32), 2.6) * 0.55
              + pow(n1(ang * 47.0 - uT * 0.5 + 17.0), 3.4) * 0.42
              + pow(n1(ang * 8.0 + uT * 0.17 + 5.0), 2.0) * 0.3;
      float fall = exp(-max(r - 0.32, 0.0) * 2.1) * smoothstep(0.78, 0.18, abs(ang));
      col += uRayCol * s * fall * uRay * 0.6;
      col += uRayCol * 0.2 * uRay * exp(-max(uSurf - uv.y, 0.0) * 5.0);  // glow under the surface
      // the surface itself (only near t = 0): a bright rippling ceiling that slides up out of frame as we sink
      float sm = smoothstep(uSurf - 0.01, uSurf + 0.025, uv.y);
      if (sm > 0.0) {
        vec2 q = vec2(uv.x * 7.0, (uv.y - uSurf) * 55.0 + uT * 1.2);
        float a = n2(q + vec2(uT * 0.7, 0.0)), b = n2(q * 1.8 + vec2(-uT * 1.0, 3.1));
        float web = pow(1.0 - abs(a - b), 5.0);
        vec3 sc = mix(vec3(0.30, 0.70, 0.90), vec3(0.93, 1.0, 1.0), web);
        col = mix(col, sc, sm);
      }
      // calm zone for the depth counter (y 150-520 px from the top): a soft, wide dip in brightness, strongest while the
      // water is still bright, so white text keeps contrast on the cyan at 0 s without a visible box
      float calm = exp(-pow((uv.y - 0.80) / 0.2, 2.0));
      col *= 1.0 - 0.42 * calm * pow(uRay, 0.9);
      col += (h2(gl_FragCoord.xy + fract(uT * 7.31) * 97.0) - 0.5) * (2.2 / 255.0); // dither: no banding in the dark blues
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bg.frustumCulled = false; bg.renderOrder = -10; scene.add(bg);

// ---------------------------------------------------------------- the can (12 oz: 66 mm x 115 mm), deformable grid
// profile (r, y) in mm from the bottom centre, round the outside, to the lid centre
const PROF = [
  [0, 9.6], [6, 9.3], [12, 8.2], [17, 6.4], [20.5, 4.4], [23, 2.3], [24.4, 0.8], [25.2, 0.15], [26.2, 0.0], [27.2, 0.35],
  [28.6, 1.4], [30.4, 3.4], [31.8, 5.6], [32.7, 7.8], [33.05, 10.0], [33.1, 12], [33.1, 99.0],
  [32.8, 101.0], [31.9, 103.3], [30.5, 105.8], [29.2, 108.0], [28.3, 110.0], [27.9, 111.3],
  [28.0, 112.2], [28.25, 113.4], [28.1, 114.6], [27.55, 115.3], [26.9, 115.2],
  [26.45, 114.4], [26.15, 112.9], [25.85, 112.1], [25.25, 111.9], [24.55, 112.3],
  [23.6, 112.9], [20, 113.3], [10, 113.6], [0, 113.7]];
const rows = []; // {r, y, s}
{
  let acc = 0;
  for (let k = 0; k < PROF.length - 1; k++) {
    const [r0, y0] = PROF[k], [r1, y1] = PROF[k + 1], L = Math.hypot(r1 - r0, y1 - y0), n = Math.max(1, Math.ceil(L / 1.05));
    for (let i = 0; i < n; i++) rows.push({ r: lerp(r0, r1, i / n), y: lerp(y0, y1, i / n), s: acc + L * i / n });
    acc += L;
  }
  rows.push({ r: 0, y: PROF[PROF.length - 1][1], s: acc });
  for (const q of rows) q.s /= acc;
}
const NR = rows.length, NT = 168, NC = NT + 1;
const NV = NR * NC;
const YMID = 57.5, LOBES = 3, PHI0 = 0.35;
const LOBE_DEPTH = [0.5, 0.4, 0.45];
const wallW = (y) => smooth(9, 30, y) * (1 - smooth(82, 104, y));
const cosT = new Float32Array(NC), sinT = new Float32Array(NC);
for (let j = 0; j < NC; j++) { const a = (j / NT) * Math.PI * 2; cosT[j] = Math.cos(a); sinT[j] = Math.sin(a); }
// static per-vertex data: wall weight, lobe index + dent profile, crease field
const sW = new Float32Array(NV), sH = new Float32Array(NV), sLobe = new Uint8Array(NV), sCr = new Float32Array(NV), sYn = new Float32Array(NV), sBell = new Float32Array(NV);
for (let i = 0; i < NR; i++) {
  const { r, y } = rows[i], w = r > 29 ? wallW(y) : 0, yn = (y - 10) / 90;
  for (let j = 0; j < NC; j++) {
    const v = i * NC + j, th = (j % NT) / NT * Math.PI * 2;
    const x = th - PHI0 - 0.45 * (yn - 0.5) - 0.08 * Math.sin(yn * 7.0 + 1.3); // lobes twist along the can
    const xm = ((x % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
    sLobe[v] = Math.round(xm / (2 * Math.PI / LOBES)) % LOBES;
    sH[v] = Math.pow(Math.abs(Math.cos(LOBES * x / 2)), 0.7);   // 0 at the (sharp) ridges, 1 at the dent centres
    sW[v] = w; sYn[v] = yn; sBell[v] = Math.sin(Math.PI * clamp01(yn));
    // crease field: a few big folds (ridged noise) + diagonal fold lines (diamond buckling)
    const cx = Math.cos(th) * 1.25, cz = Math.sin(th) * 1.25;
    const rg = 1 - Math.abs(2 * fbm(cx + 11.3, yn * 2.4, cz + 4.1, 2) - 1);
    const dia = 1 - Math.min(Math.abs(Math.sin(2.5 * th + 6.2 * yn + 0.7)), Math.abs(Math.sin(2.5 * th - 6.2 * yn + 2.1)));
    sCr[v] = Math.pow(rg, 4) * 0.9 + Math.pow(dia, 5) * 0.45 - 0.18;
  }
}
const canGeo = new THREE.BufferGeometry();
const posA = new Float32Array(NV * 3), nrmA = new Float32Array(NV * 3), uvA = new Float32Array(NV * 2);
const mmPos = new Float32Array(NV * 3);
for (let i = 0; i < NR; i++) for (let j = 0; j < NC; j++) { const v = i * NC + j; uvA[v * 2] = j / NT; uvA[v * 2 + 1] = rows[i].s; }
const idx = [];
for (let i = 0; i < NR - 1; i++) for (let j = 0; j < NT; j++) {
  const a = i * NC + j, b = a + 1, c = a + NC, d = c + 1;
  idx.push(a, c, b, b, c, d);
}
canGeo.setIndex(idx);
canGeo.setAttribute("position", new THREE.BufferAttribute(posA, 3));
canGeo.setAttribute("normal", new THREE.BufferAttribute(nrmA, 3));
canGeo.setAttribute("uv", new THREE.BufferAttribute(uvA, 2));
canGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 9);

// crush state at time t (pure functions of t)
function easeOutBack(u, c1 = 1.4) { const c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }
function crushState(t) {
  const s = (t - C0) / (C1 - C0), onset = [0, 0.1, 0.18], a = [], ext = [];
  for (let k = 0; k < 3; k++) {
    const u = clamp01((s - onset[k]) / 0.45);
    a.push(u <= 0 ? 0 : easeOutBack(u)); ext.push(smooth(0, 0.6, u));
  }
  // "oil-canning" just before the implosion: the wall facing lobe 0 flexes in and out
  const pre = smooth(C0 - 0.4, C0 - 0.1, t) * (1 - smooth(C0 - 0.02, C0 + 0.04, t)) * (0.5 + 0.5 * Math.sin((t - C0) * 38));
  return { a, ext, pre: pre * 0.07, sq: smooth(0.05, 0.75, s), cr: smooth(0.1, 0.85, s), sh: smooth(0.1, 0.8, s), kink: smooth(0.15, 0.95, s), s };
}
const SH_MM = 10, KINK = 0.17, TWIST = 0.2, PIVOT = 56, SQUEEZE = 0.24;
function deformCan(t) {
  const st = crushState(t);
  const half = st.ext.map((e) => lerp(0.14, 0.85, e));
  const kAng = KINK * st.kink, tw = TWIST * st.kink;
  for (let i = 0; i < NR; i++) {
    const r0 = rows[i].r, y0 = rows[i].y;
    const top = smooth(10, 100, y0), kw = smooth(34, 82, y0), twW = smooth(15, 104, y0);
    let lidSink = 0;
    if (y0 > 111.5 && r0 < 25) lidSink = st.cr * 1.6 * (1 - r0 / 25);
    const ys = y0 - SH_MM * st.sh * top - lidSink;
    const ca = Math.cos(kAng * kw), sa = Math.sin(kAng * kw), ct = Math.cos(tw * twW), stt = Math.sin(tw * twW);
    for (let j = 0; j < NC; j++) {
      const v = i * NC + j, w = sW[v];
      let r = r0;
      if (w > 0) {
        const L = sLobe[v], yn = sYn[v];
        const win = 1 - smooth(half[L] - 0.22, half[L], Math.abs(yn - 0.52));
        const dentK = st.a[L] * win;                                       // 0..~1.1, how far this dent has gone
        const dent = dentK * LOBE_DEPTH[L] * sH[v] * w + (L === 0 ? st.pre * sH[v] * w * sBell[v] : 0);
        const squeeze = SQUEEZE * st.sq * w * (0.55 + 0.45 * sBell[v]);
        const crease = st.cr * w * sCr[v] * (0.03 + 0.12 * Math.min(1, dentK) * (0.35 + 0.65 * sH[v]));
        r = r0 * Math.max(0.12, 1 - dent - squeeze - crease);
      }
      let x = r * cosT[j], z = r * sinT[j];
      const x1 = x * ct - z * stt, z1 = x * stt + z * ct; x = x1; z = z1;   // twist about the axis
      const yy = ys - PIVOT;                                                   // kink about the mid-height
      const xk = x * ca - yy * sa, yk = x * sa + yy * ca + PIVOT;
      mmPos[v * 3] = xk; mmPos[v * 3 + 1] = yk; mmPos[v * 3 + 2] = z;
      posA[v * 3] = xk / 10; posA[v * 3 + 1] = (yk - YMID) / 10; posA[v * 3 + 2] = z / 10;
    }
  }
  // normals straight from the grid (wraps around the seam; the two poles point down / up)
  for (let i = 0; i < NR; i++) for (let j = 0; j < NC; j++) {
    const v = i * NC + j;
    if (rows[i].r < 0.01) { nrmA[v * 3] = 0; nrmA[v * 3 + 1] = i === 0 ? -1 : 1; nrmA[v * 3 + 2] = 0; continue; }
    const jp = (j % NT) + 1, jm = ((j % NT) + NT - 1) % NT;
    const ip = Math.min(NR - 1, i + 1), im = Math.max(0, i - 1);
    const a = i * NC + jp, b = i * NC + jm, c = ip * NC + (j % NT), d = im * NC + (j % NT);

  snowMat.uniforms.uFocus.value = dist;
  snowMat.uniforms.uCol.value.set(...mix3([0.8, 0.92, 0.96], [0.5, 0.68, 0.86], Ks));
  bubMat.uniforms.uLight.value = lerp(1, 0.55, Ks);
  updateBubbles(t, D, camPos);
  renderer.render(scene, camera);
}
