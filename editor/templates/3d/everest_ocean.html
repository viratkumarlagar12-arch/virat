<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=1080, height=1920" />
<title>Everest under the sea 3D</title>
<!-- Hook scene for "11 KM neeche samundar mein kya hai?" (Mariana Trench Short): Mount Everest sinks into the ocean and
     ends with ~2.1 km of water above its summit (Challenger Deep ~10.94 km minus Everest 8.85 km).
     Look: a split "over-under" shot, like a camera dome half in the water: sky + the sea surface (moving waves, sky
     reflection) above a wavy waterline, deep navy water below (light shafts, marine snow, depth haze).
     Units are km. The mountain is a procedural heightfield (three-sided pyramid with ridges, erosion, rock strata, the
     yellowish band near the top, snow on gentle slopes, baked sun shadows + occlusion), all from seeded noise.
     Beats (CFG, absolute seconds):
       0.0-0.5  summit just above the water, headline + sub already on screen (the first frame reads on its own)
       sinkStart..sinkEnd  the mountain sinks; when the summit goes under: foam at the waterline, spray above it,
                bubbles and churned water below it
       revealStart..revealEnd  the camera pulls back so the whole gap shows; a yellow bracket draws from the surface
                down to the summit; the "~2.1 KM PAANI" label pops at labelAt
       then a hold with a slow drift.
     Text is real HTML (Montserrat). CFG.text=false renders a clean plate (no headline, sub, bracket or label) for
     edits that add their own overlays.
     Preview: open index.html?preview in a browser (render3d.py <this> --preview serves it): play/pause + scrubber.
     Render: python editor/scripts/render3d.py editor/templates/3d/everest_ocean.html out.mp4 (1080x1920, 30 fps). -->
<script>
window.CFG = { duration: 4, text: true, seed: 7, aboveKm: 1.0, gapKm: 2.09, sinkStart: 0.5, sinkEnd: 2.0, revealStart: 2.0, revealEnd: 3.2, bracketStart: 2.05, bracketEnd: 2.75, labelAt: 2.7 };
</script>

<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">

<script>

    const C = window.CFG;
    document.getElementById("root").setAttribute("data-duration", String(C.duration));
    const tl = gsap.timeline({ paused: true });
    tl.set({}, {}, C.duration); // timeline length == composition length; everything is drawn by renderAt(t)
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;

<script type="module">
import * as THREE from "three";

const CFG = window.CFG;
const W = 1080, H = 1920, FOV = 38, D2R = Math.PI / 180;
const TT = CFG.duration;
const PXF = (H / 2) / Math.tan(FOV / 2 * D2R);           // focal length in px
const HORIZON_Y = 600, MENISCUS_Y = 662, SUMMIT_X = 432;  // screen layout (px from top / left)
const PITCH = Math.atan((H / 2 - HORIZON_Y) / PXF);
const CAM_TOP_Y = 0.2, CAM_BOT_Y = -0.045;              // the two halves of the "dome" (km above/below the water)
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 1000003 + (CFG.seed | 0) * 7919;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// ---------------------------------------------------------------- seeded value noise (JS, static detail)
const P = new Uint8Array(512);
for (let i = 0; i < 256; i++) P[i] = i;
for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [P[i], P[j]] = [P[j], P[i]]; }
for (let i = 0; i < 256; i++) P[i + 256] = P[i];
const fade = (t) => t * t * (3 - 2 * t);
function vnoise(x, y, z) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const u = fade(x), v = fade(y), w = fade(z);
  const h = (a, b, c) => P[P[P[a] + b] + c] / 255;
  const l = (a, b, t) => a + (b - a) * t;
  return l(l(l(h(X, Y, Z), h(X + 1, Y, Z), u), l(h(X, Y + 1, Z), h(X + 1, Y + 1, Z), u), v),
           l(l(h(X, Y, Z + 1), h(X + 1, Y, Z + 1), u), l(h(X, Y + 1, Z + 1), h(X + 1, Y + 1, Z + 1), u), v), w);
}
function fbm(x, y, z, oct) { let a = 0.5, f = 1, s = 0, n = 0; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f); n += a; f *= 2.03; a *= 0.5; } return s / n; }
function ridged(x, z, oct) { // ridged multifractal: sharp crests, eroded gullies
  let s = 0, a = 0.5, f = 1, w = 1, n = 0;
  for (let i = 0; i < oct; i++) {
    let v = 1 - Math.abs(vnoise(x * f, 0.37 * i + 5.1, z * f) * 2 - 1); v *= v;
    s += a * v * w; n += a; w = Math.min(1, v * 1.7); f *= 2.07; a *= 0.5;
  }
  return s / n;
}

// ---------------------------------------------------------------- the mountain heightfield (local km, base at y=0)
const GN = 300, GS = 36;                  // grid cells per side, size (km)
const HP = 8.85;                           // Everest above its base, km
const RIDGES = [{ a: 0.42, s: 1.0, w: 0.05 }, { a: 2.38, s: 0.92, w: 0.06 }, { a: 4.25, s: 1.06, w: 0.05 }];
const PEAKS = [{ x: 3.4, z: 1.0, h: 0.8, r: 1.3 }, { x: -3.9, z: 2.0, h: 0.55, r: 1.5 }, { x: -1.4, z: -4.8, h: 1.0, r: 1.8 }];
const angDiff = (a, b) => { let d = (a - b) % (2 * Math.PI); if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; return d; };
function heightAt(x, z) {
  const r = Math.hypot(x, z), th = Math.atan2(z, x);
  let rf = 0;
  for (const R of RIDGES) { const d = angDiff(th, R.a); rf = Math.max(rf, Math.exp(-d * d / R.w) * R.s); }
  const warp = (fbm(x * 0.11 + 3.3, 1.3, z * 0.11 + 7.7, 3) - 0.5) * 3.4;
  const R0 = 6.9 + 9.0 * rf + warp;
  const k = clamp01(1 - r / R0);
  let h = HP * Math.pow(k, 1.95) + 0.8 * rf * k * (1 - k) * 4;
  const calm = 1 - Math.exp(-r * r / 1.1);                       // keep the summit a clean point
  h += (ridged(x * 0.36 + 11.0, z * 0.36 - 5.0, 6) - 0.42) * 1.9 * Math.pow(k, 0.5) * calm;
  h += (fbm(x * 1.3, 2.2, z * 1.3, 3) - 0.5) * 0.25 * k;
  h += (ridged(x * 1.6 - 3.0, z * 1.6 + 8.0, 4) - 0.45) * 0.32 * Math.pow(k, 2.0) * (1 - Math.exp(-r * r / 0.05));
  for (const p of PEAKS) { const d2 = (x - p.x) ** 2 + (z - p.z) ** 2; h += p.h * Math.exp(-d2 / (p.r * p.r)) * Math.pow(k, 0.4); }
  const bed = (fbm(x * 0.2 + 40, 0.5, z * 0.2, 4) - 0.5) * 0.35;
  return Math.max(h, bed);
}
const NV = GN + 1, CELL = GS / GN;
const hgt = new Float32Array(NV * NV);
for (let j = 0; j < NV; j++) for (let i = 0; i < NV; i++) hgt[j * NV + i] = heightAt(-GS / 2 + i * CELL, -GS / 2 + j * CELL);
let iMax = 0; for (let i = 1; i < hgt.length; i++) if (hgt[i] > hgt[iMax]) iMax = i;
const HMAX = hgt[iMax];
const PEAK_X = -GS / 2 + (iMax % NV) * CELL, PEAK_Z = -GS / 2 + Math.floor(iMax / NV) * CELL;
function hLookup(x, z) { // bilinear on the grid (local km)
  const fx = clamp01((x + GS / 2) / GS) * GN, fz = clamp01((z + GS / 2) / GS) * GN;
  const i = Math.min(GN - 1, Math.floor(fx)), j = Math.min(GN - 1, Math.floor(fz)), u = fx - i, v = fz - j;
  const a = hgt[j * NV + i], b = hgt[j * NV + i + 1], c = hgt[(j + 1) * NV + i], d = hgt[(j + 1) * NV + i + 1];
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
// sun (world == local directions); low afternoon sun from the front-left, outside the frame
const SUN = new THREE.Vector3(-0.55, 0.55, -0.62).normalize();
// baked sun visibility (march towards the sun over the heightfield) and a cheap occlusion term (height vs local mean)
const shade = new Float32Array(NV * NV), ao = new Float32Array(NV * NV);
{
  const sx = SUN.x, sz = SUN.z, sl = Math.hypot(sx, sz), rise = SUN.y / sl, step = 0.12;
  for (let j = 0; j < NV; j++) for (let i = 0; i < NV; i++) {
    const x = -GS / 2 + i * CELL, z = -GS / 2 + j * CELL, h0 = hgt[j * NV + i];
    let vis = 1;
    for (let s = 1; s <= 60; s++) {
      const d = s * step, hh = hLookup(x + sx / sl * d, z + sz / sl * d), clear = h0 + 0.02 + rise * d - hh;
      if (clear < 0) { vis = Math.min(vis, clamp01(1 + clear * 6)); if (vis <= 0) break; }
      if (h0 + rise * d > HMAX) break;
    }
    shade[j * NV + i] = vis;
  }
  const R = 5, tmp = new Float32Array(NV * NV), mean = new Float32Array(NV * NV);
  for (let j = 0; j < NV; j++) for (let i = 0; i < NV; i++) { let s = 0, n = 0; for (let k = -R; k <= R; k++) { const ii = i + k; if (ii >= 0 && ii < NV) { s += hgt[j * NV + ii]; n++; } } tmp[j * NV + i] = s / n; }
  for (let j = 0; j < NV; j++) for (let i = 0; i < NV; i++) { let s = 0, n = 0; for (let k = -R; k <= R; k++) { const jj = j + k; if (jj >= 0 && jj < NV) { s += tmp[jj * NV + i]; n++; } } mean[j * NV + i] = s / n; }
  for (let i = 0; i < NV * NV; i++) ao[i] = Math.max(0.35, Math.min(1.08, 1 - (mean[i] - hgt[i]) * 0.9));
}

// ---------------------------------------------------------------- renderer, targets
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: false, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // the composite pass writes display-ready sRGB itself
renderer.toneMapping = THREE.NoToneMapping;
const rtOpts = { type: THREE.HalfFloatType, samples: 4, depthBuffer: true };
const rtTop = new THREE.WebGLRenderTarget(W, H, rtOpts), rtBot = new THREE.WebGLRenderTarget(W, H, rtOpts);
const sceneTop = new THREE.Scene(), sceneBot = new THREE.Scene();
const camTop = new THREE.PerspectiveCamera(FOV, W / H, 0.01, 420), camBot = new THREE.PerspectiveCamera(FOV, W / H, 0.01, 420);
camTop.rotation.order = "YXZ"; camBot.rotation.order = "YXZ";
sceneBot.add(camBot);

// ---------------------------------------------------------------- shared GLSL
const GL_NOISE = `
float hash3(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
float vn(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i), hash3(i+vec3(1,0,0)), f.x), mix(hash3(i+vec3(0,1,0)), hash3(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash3(i+vec3(0,0,1)), hash3(i+vec3(1,0,1)), f.x), mix(hash3(i+vec3(0,1,1)), hash3(i+vec3(1,1,1)), f.x), f.y), f.z); }
`;
// dusk sky: dark navy zenith, cool steel horizon, warm glow towards the (off-frame) sun, thin cloud bands
const GL_SKY = `
uniform vec3 uSun;
vec3 skyCol(vec3 d){
  float y = max(d.y, -0.02);
  vec3 zen = vec3(0.003, 0.008, 0.026), hor = vec3(0.070, 0.090, 0.135);
  vec3 c = mix(hor, zen, pow(smoothstep(0.0, 0.55, y), 0.65));
  vec3 sd = normalize(vec3(uSun.x, 0.0, uSun.z)), dh = normalize(vec3(d.x, 0.0, d.z) + 1e-5);
  float az = max(dot(sd, dh), 0.0);
  c += vec3(0.30, 0.15, 0.07) * pow(az, 6.0) * exp(-y * 7.0) * 0.7;
  c += vec3(0.6, 0.45, 0.32) * pow(max(dot(d, uSun), 0.0), 40.0) * 0.6;
  float cl = vn(vec3(d.x / max(y, 0.04) * 1.6, d.z / max(y, 0.04) * 0.25, 3.0)) * vn(vec3(d.x / max(y, 0.04) * 4.0, 1.7, d.z / max(y, 0.04)));
  cl = smoothstep(0.32, 0.62, cl) * smoothstep(0.0, 0.05, y) * (1.0 - smoothstep(0.12, 0.35, y));
  c = mix(c, vec3(0.05, 0.06, 0.08) + vec3(0.22, 0.13, 0.07) * pow(az, 3.0), cl * 0.75);
  return c;
}
`;
// underwater ambient colour by view direction and depth (km below the surface)
const GL_WATER = `
vec3 waterCol(vec3 d, float depth){
  vec3 shallow = vec3(0.020, 0.105, 0.185), deep = vec3(0.0012, 0.0055, 0.014);
  float k = smoothstep(-0.55, 0.06, d.y) * exp(-depth * 0.06);
  return mix(deep, shallow, k);
}
`;

// ---------------------------------------------------------------- mountain material (both halves)
const MN = 380, gradeC = (u) => GS / 2 * (0.3 * u + 0.7 * u * u * u);
const gridLerp = (arr, x, z) => {
  const fx = clamp01((x + GS / 2) / GS) * GN, fz = clamp01((z + GS / 2) / GS) * GN;
  const i = Math.min(GN - 1, Math.floor(fx)), j = Math.min(GN - 1, Math.floor(fz)), u = fx - i, v = fz - j;
  return lerp(lerp(arr[j * NV + i], arr[j * NV + i + 1], u), lerp(arr[(j + 1) * NV + i], arr[(j + 1) * NV + i + 1], u), v);
};
const mGeo = new THREE.PlaneGeometry(2, 2, MN, MN); mGeo.rotateX(-Math.PI / 2);
let MESH_MAX = -1, MESH_PX = 0, MESH_PZ = 0;
{
  const pos = mGeo.attributes.position, sh = new Float32Array(pos.count), oc = new Float32Array(pos.count);
  for (let k = 0; k < pos.count; k++) {
    const x = gradeC(pos.getX(k)), z = gradeC(pos.getZ(k)), y = heightAt(x, z);
    pos.setXYZ(k, x, y, z); sh[k] = gridLerp(shade, x, z); oc[k] = gridLerp(ao, x, z);
    if (y > MESH_MAX) { MESH_MAX = y; MESH_PX = x; MESH_PZ = z; }
  }
  mGeo.setAttribute("aShade", new THREE.BufferAttribute(sh, 1));
  mGeo.setAttribute("aAO", new THREE.BufferAttribute(oc, 1));
  mGeo.computeVertexNormals();
}
const bedGeo = new THREE.PlaneGeometry(700, 700, 1, 1); bedGeo.rotateX(-Math.PI / 2); bedGeo.translate(0, -0.03, 0);
bedGeo.setAttribute("aShade", new THREE.BufferAttribute(new Float32Array(4).fill(1), 1));
bedGeo.setAttribute("aAO", new THREE.BufferAttribute(new Float32Array(4).fill(0.8), 1));
const rockMat = new THREE.ShaderMaterial({
  uniforms: { uSun: { value: SUN }, uCam: { value: new THREE.Vector3() }, uUnder: { value: 0 }, uT: { value: 0 }, uHaze: { value: 0.028 } },
  vertexShader: `attribute float aShade; attribute float aAO;
    varying vec3 vW; varying vec3 vN; varying float vShade; varying float vAO; varying float vH;
    void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; vN = normalize(mat3(modelMatrix) * normal);
      vShade = aShade; vAO = aAO; vH = position.y; gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: GL_NOISE + GL_SKY + GL_WATER + `
    uniform vec3 uCam; uniform float uUnder, uT, uHaze;
    varying vec3 vW; varying vec3 vN; varying float vShade; varying float vAO; varying float vH;
    void main(){
      vec3 lp = vec3(vW.x, vH, vW.z);
      vec3 n = normalize(vN);
      // fine rock relief (noise gradient bump)
      float e = 0.05;
      float n0 = vn(lp * 4.5) + 0.5 * vn(lp * 10.0);
      float nx = vn((lp + vec3(e, 0.0, 0.0)) * 4.5) + 0.5 * vn((lp + vec3(e, 0.0, 0.0)) * 10.0);
      float nz = vn((lp + vec3(0.0, 0.0, e)) * 4.5) + 0.5 * vn((lp + vec3(0.0, 0.0, e)) * 10.0);
      vec3 nb = normalize(n + vec3(n0 - nx, 0.0, n0 - nz) * 2.0);
      // rock: dark grey-brown with layered strata; the pale-yellow limestone band just under the summit
      float strata = 0.5 + 0.5 * sin(vH * 11.0 + vn(lp * 1.3) * 5.0);
      vec3 rock = mix(vec3(0.060, 0.055, 0.050), vec3(0.135, 0.118, 0.100), strata * 0.75 + 0.25 * vn(lp * 2.5));
      float yb = smoothstep(7.70, 7.85, vH) * (1.0 - smoothstep(8.15, 8.30, vH));
      rock = mix(rock, vec3(0.30, 0.24, 0.14), yb * 0.7);
      // snow: on gentler slopes, more of it higher up, wind-streaked
      float sl = n.y + 0.16 * (vn(lp * 3.0) - 0.5) + 0.08 * (vn(lp * 8.0) - 0.5);
      float line = 3.0 + 0.9 * vn(lp * 0.7);
      float snow = smoothstep(0.66, 0.80, sl) * smoothstep(line - 0.4, line + 1.2, vH);
      snow = max(snow, 0.9 * smoothstep(0.30, 0.48, sl + 0.12 * (vn(vec3(lp.x * 6.0, vH * 3.0, lp.z * 6.0)) - 0.5)) * smoothstep(6.4, 7.4, vH));
      snow *= 0.6 + 0.4 * smoothstep(0.25, 0.6, vn(vec3(lp.x * 4.0, vH * 1.5, lp.z * 4.0)));
      vec3 alb = mix(rock, vec3(0.80, 0.84, 0.90), snow);
      float dif = max(dot(nb, uSun), 0.0) * vShade;
      vec3 col;
      float dist = length(vW - uCam);
      vec3 vdir = normalize(vW - uCam);
      if (uUnder < 0.5) {
        vec3 sunC = vec3(1.0, 0.82, 0.64) * 2.4, skyC = vec3(0.20, 0.28, 0.46) * 0.85;
        col = alb * (sunC * dif + skyC * (0.45 + 0.55 * nb.y) * vAO);
        vec3 h = normalize(uSun - vdir);
        col += snow * vec3(1.0, 0.85, 0.7) * pow(max(dot(nb, h), 0.0), 60.0) * vShade * 1.2;
        col = mix(col, skyCol(vdir) * 1.05, 1.0 - exp(-dist * uHaze));
      } else {
        float depth = max(0.0, -vW.y);
        float lightK = exp(-depth * 0.21);                         // daylight left at this depth
        vec3 ld = normalize(vec3(-0.40, 0.88, -0.10));
        float dl = max(dot(nb, ld), 0.0);

  // bottom half (water)
  rockMat.uniforms.uUnder.value = 1; rockMat.uniforms.uCam.value.copy(camBot.position);
  renderer.setRenderTarget(rtBot); renderer.render(sceneBot, camBot);
  // composite to the canvas
  compMat.uniforms.uT.value = t;
  renderer.setRenderTarget(null); renderer.render(compScene, compCam);
  drawText(t);
}
window.renderAt = renderAt;
window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
renderAt(window.__hfThreeTime || 0);

// ---------------------------------------------------------------- preview mode (?preview): play/pause + scrubber
if (new URLSearchParams(location.search).has("preview")) {
  const root = $("root");
  const fit = () => { const k = Math.min(innerWidth / W, (innerHeight - 60) / H); root.style.transformOrigin = "0 0"; root.style.transform = `scale(${k})`; root.style.marginLeft = `${Math.max(0, (innerWidth - W * k) / 2)}px`;
    document.body.style.width = innerWidth + "px"; document.body.style.height = innerHeight + "px"; document.documentElement.style.height = innerHeight + "px"; };
  const bar = document.createElement("div"); bar.id = "pv";
  bar.innerHTML = `<button id="pvPlay">Pause</button><input id="pvT" type="range" min="0" max="${TT}" step="${1 / 30}" value="0" /><span id="pvLab">0.00 s</span>`;
  document.body.appendChild(bar); fit(); addEventListener("resize", fit);
  let playing = true, t0 = performance.now(), cur = 0;
  const show = (t) => { cur = t; renderAt(t); $("pvT").value = String(t); $("pvLab").textContent = `${t.toFixed(2)} s`; };
  $("pvPlay").onclick = () => { playing = !playing; $("pvPlay").textContent = playing ? "Pause" : "Play"; t0 = performance.now() - cur * 1000; };
  $("pvT").oninput = (e) => { playing = false; $("pvPlay").textContent = "Play"; show(parseFloat(e.target.value)); };
  const loop = () => { if (playing) show(((performance.now() - t0) / 1000) % TT); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
